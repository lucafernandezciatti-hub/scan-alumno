<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miseño · App del alumno</title>
<!--
  MISEÑO · APP DEL ALUMNO — prototipo v1.3
  Diseño Interactivo (UTDT) · escenario "Enseñanza Scan 360". Definición: https://claude.ai/artifact/6tipJiz2sJz1bDrqohDWve
  Joaquín, Sofía o Bruno pasan una mañana en Miseño con Guio, su tutor, que los deriva con un profe por materia.
  22 momentos, solo hacia adelante. Voz solo guionada: dice exactamente el texto de cada momento.

  Teclado: Enter acción principal · N no entiendo · R repetir · F panel de prueba · Shift+R reiniciar.
  Panel de prueba (F): notas del observador, saltar a un momento, voz (ElevenLabs o navegador),
                       lectura de los sensores, copiar el registro.

  Versiones
    v1.3 (19/11/2026): tres perfiles (Joaquín, Sofía, Bruno) con su día, sus clases y una clase integradora de la
                       huerta con dos profes; profes nuevos Dona (Dibujo) y Rolo (Gastronomía), por ahora provisorios;
                       anuncio del proyecto grupal. Perfil: tocar el avatar arriba de la línea del día, o el panel (F).
    v1.2 (19/11/2026): composición centrada; cada momento toma el pastel de su personaje (Guio celeste,
                       Numi rojo, Otto naranja, Fini verde, recreo amarillo).
    v1.1 (18/11/2026): personajes reales con 5 estados (Guio tutor, Numi Matemática, Otto Lengua, Fini Ciencias),
                       apertura con logo, animaciones de entrada y salida, relevo de profe y pregunta
                       metacognitiva al final de cada clase en vez de resultados.
    v1.0 (18/11/2026): rediseño completo desde el doc de definición. Línea de tiempo del día, tonos pastel por
                       momento, Miseño y profes (figuras provisorias), lecciones en 4 momentos.
    v0.5.x: versión anterior (lecciones interactivas, agente conversacional). Guardada en versiones/.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tonos por momento: fondo, suave, nodito, botón, texto (definición > Identidad visual) */
:root{
  --fondo:#E8F6FC; --suave:#BEE6F6; --nodo:#36BDE6; --boton:#0B7DA3; --texto:#08374A;
  --blanco:#FFFFFF; --ok-bg:#E1F5EE; --ok-tx:#085041; --casi-bg:#FAEEDA; --casi-tx:#633806;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace; --sans:"IBM Plex Sans", system-ui, sans-serif;
  --r-tarjeta:24px; --t-tono:800ms; --t-entra:400ms;
}
[data-tono="mate"]    {--fondo:#FDEDEF; --suave:#F7C6CD; --nodo:#E4566A; --boton:#B42A3E; --texto:#4D0F19}
[data-tono="lengua"]  {--fondo:#FEF1E6; --suave:#F9D0AE; --nodo:#EF8638; --boton:#A64E0E; --texto:#4A2309}
[data-tono="recreo"]  {--fondo:#FDF7DE; --suave:#F4E29C; --nodo:#E2B41C; --boton:#7E6000; --texto:#3B2E00}
[data-tono="dibujo"]  {--fondo:#F2EDFF; --suave:#D9CBFF; --nodo:#8A4FFF; --boton:#6131D6; --texto:#25104F}
[data-tono="gastro"]  {--fondo:#FFEEF5; --suave:#FFC7DD; --nodo:#FF5FA2; --boton:#C42A6C; --texto:#4D0C29}
[data-tono="huerta"]  {--fondo:#F2F8E4; --suave:#D5E9AE; --nodo:#8DBF3F; --boton:#4D7A12; --texto:#1F3307}
[data-tono="ciencias"]{--fondo:#EBF7EC; --suave:#C0E6C8; --nodo:#42BE62; --boton:#1D7D3A; --texto:#0D3B1C}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--texto);background:var(--fondo);transition:background-color var(--t-tono) ease, color var(--t-tono) ease;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--boton);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-columns:200px minmax(0,1fr) 200px;min-height:100vh;max-width:1400px;margin:0 auto}

/* Línea de tiempo del día */
.dia{padding:0 0 40px 40px;position:relative;display:flex;align-items:center}
.dia ol{width:100%}
.dia ol{list-style:none;margin:0;padding:0;position:sticky;top:calc(50vh - 180px)}
.dia li{position:relative;padding:0 0 44px 30px;opacity:0;transform:translateY(8px);transition:opacity var(--t-entra), transform var(--t-entra)}
.dia li.visible{opacity:1;transform:none}
.dia li::before{content:"";position:absolute;left:5px;top:16px;bottom:-2px;width:2px;background:var(--suave);transition:background var(--t-tono)}
.dia li:last-child::before{display:none}
.dia .pto{position:absolute;left:0;top:3px;width:12px;height:12px;border-radius:50%;background:var(--blanco);border:2px solid var(--c);transition:all .4s}
.dia li.actual .pto{background:var(--c);box-shadow:0 0 0 6px color-mix(in srgb, var(--c) 30%, transparent)}
.dia li.hecho .pto{background:var(--c)}
.dia li.hecho .pto::after{content:"";position:absolute;left:3px;top:0;width:3px;height:6px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.dia .nom{font-weight:500;font-size:17px;line-height:1.1}
.dia .hora{font-family:var(--mono);font-size:13px;opacity:.7;margin-top:2px}
.dia li.pendiente .nom{opacity:.55}
.fases{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.fases li{padding:0;opacity:1;transform:none;font-family:var(--mono);font-size:13px;display:flex;align-items:center;gap:8px}
.fases li::before{display:none}
.fases i{width:6px;height:6px;border-radius:50%;background:var(--suave)}
.fases .ahora{font-weight:500}
.fases .ahora i{background:var(--boton)}
.fases .ya i{background:var(--nodo)}
.fases .ya{opacity:.6}

/* Escenario */
.main{padding:40px 24px 32px;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:920px;width:100%;margin:0 auto;min-height:100vh}
.voz{display:grid;grid-template-columns:124px minmax(0,1fr) auto;align-items:center;gap:20px;min-height:110px;position:sticky;top:0;z-index:5;background:var(--fondo);padding:12px 0;transition:background-color var(--t-tono)}
/* Personajes: imagen por estado; el cuerpo respira, al hablar se mece, al festejar salta */
.mascota{width:124px;height:124px;position:relative}
.mascota .cuerpo{position:absolute;inset:0;transform-origin:50% 100%;animation:respira 4s ease-in-out infinite}
.mascota[data-estado="habla"] .cuerpo{animation:mece .9s ease-in-out infinite}
.mascota[data-estado="festeja"] .cuerpo{animation:salta .55s cubic-bezier(.3,.7,.4,1) 3}
.mascota[data-estado="anima"] .cuerpo{animation:inclina 1.6s ease-in-out infinite}
.mascota[data-estado="piensa"] .cuerpo{animation:respira 5s ease-in-out infinite}
.mascota img{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 100%}
.mascota img.pop{animation:pop .55s cubic-bezier(.3,1.5,.5,1) both}
.mascota img.tic{animation:tic .22s ease}
.mascota img.sale{animation:hunde .23s ease-in forwards}
@keyframes respira{50%{transform:scale(1.025,.985)}}
@keyframes mece{25%{transform:rotate(-2deg) translateY(-2px)}75%{transform:rotate(2deg) translateY(-2px)}}
@keyframes salta{40%{transform:translateY(-12px) scale(.98,1.03)}80%{transform:translateY(0) scale(1.03,.97)}}
@keyframes inclina{50%{transform:rotate(-4deg)}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.6)}to{opacity:1;transform:none}}
@keyframes tic{50%{transform:scale(1.04,.96)}}
@keyframes hunde{to{opacity:0;transform:translateY(14px) scale(.7)}}
.boca{transform-box:fill-box;transform-origin:center}
.subtitulo{font-family:var(--mono);font-size:24px;line-height:1.4;margin:0;text-wrap:pretty;max-width:34ch}
#sub{display:block}
.sube{animation:sube .35s ease both}
@keyframes sube{from{opacity:0;transform:translateY(6px)}}
.quien{display:block;font-family:var(--mono);font-size:13px;opacity:.65;margin-bottom:6px}
.repetir{border:1.5px solid var(--suave);background:transparent;border-radius:99px;padding:8px 14px;font-family:var(--mono);font-size:14px;display:inline-flex;gap:6px;align-items:center}
.repetir svg{width:16px;height:16px}

.tarjeta{background:var(--blanco);border-radius:var(--r-tarjeta);padding:28px 32px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative}
.tarjeta > *{animation:entra var(--t-entra) cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--n,0) * 90ms)}
.tarjeta.sale{pointer-events:none}
.tarjeta.sale > *{animation:sale .26s ease-in forwards}
@keyframes sale{to{opacity:0;transform:translateY(-12px)}}
.tarjeta .sale{animation:sale .2s ease-in forwards}
.late{animation:late .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes late{from{opacity:0;transform:scale(.94)}}
.opciones > *,.escala > *,.amigos > *,.cambios ul > *{animation:aparece .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(180ms + var(--i,0) * 80ms)}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.acciones{position:sticky;bottom:0;z-index:5;padding:12px 0;background:var(--fondo);transition:background-color var(--t-tono);display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.principal{min-height:60px;min-width:180px;padding:0 34px;border:none;border-radius:99px;background:var(--boton);color:#fff;font-size:20px;font-weight:500;transition:background var(--t-tono), transform .1s}
.principal:active{transform:scale(.98)}
.entra-btn{animation:entraBtn .38s cubic-bezier(.3,1.4,.5,1) both}
@keyframes entraBtn{from{opacity:0;transform:translateY(10px) scale(.9)}}
.principal.sale,.noent.sale{animation:saleBtn .2s ease-in forwards;pointer-events:none}
@keyframes saleBtn{to{opacity:0;transform:translateY(8px) scale(.94)}}
.principal.tic{animation:tic .25s ease}
/* Dos profes en el encabezado (clases integradoras) */
.mascotas{position:relative;width:124px;height:124px}
.voz.duo{grid-template-columns:200px minmax(0,1fr) auto}
.voz.duo .mascotas{width:200px}
.voz.duo .mascota{width:110px;height:110px;position:absolute;top:8px}
.voz.duo #mascota{left:0}
.voz.duo #mascota2{left:88px}
.mascota[hidden]{display:none}
/* Perfil escondido: avatar del chico */
.yo-caja{position:absolute;top:28px;left:40px}
.yo{width:34px;height:34px;border-radius:50%;border:none;background:var(--suave);color:var(--texto);font-weight:600;font-size:15px;opacity:.55;transition:opacity .2s, background var(--t-tono)}
.yo:hover,.yo:focus-visible{opacity:1}
.perfiles{position:absolute;top:42px;left:0;z-index:15;background:var(--blanco);border-radius:18px;padding:8px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:2px;min-width:190px}
.perfiles[hidden]{display:none}
.perfiles button{display:grid;grid-template-columns:32px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:none;background:transparent;border-radius:12px;padding:8px 10px;font-size:16px}
.perfiles button:hover{background:var(--fondo)}
.perfiles button[aria-current]{background:var(--fondo);font-weight:600}
.perfiles i{grid-row:span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--suave);font-weight:600}
.perfiles small{font-family:var(--mono);font-size:12px;opacity:.65;font-weight:400}
.dia .sub{font-family:var(--mono);font-size:12px;opacity:.6;margin-top:1px}
.plan small{font-weight:400;opacity:.7;font-size:15px}
/* Widgets nuevos */
.caja{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.contador-w{display:flex;align-items:center;gap:12px;justify-content:center}
.contador-w .cw-lbl{font-family:var(--mono);font-size:15px;opacity:.75;margin-right:4px}
.contador-w button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--suave);background:var(--blanco);font-size:24px;line-height:1}
.contador-w b{min-width:72px;text-align:center;font-family:var(--mono);font-size:24px;font-weight:500}
.vista{width:100%;display:flex;justify-content:center}
.vista svg{width:100%;max-width:420px;height:auto}
.vista.tocable [data-p]{cursor:pointer;transition:opacity .2s, filter .2s}
.vista.tocable:has(.brilla) [data-p]:not(.brilla){opacity:.35}
.brilla{filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
.dos-vistas{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.dos-vistas .vista{background:var(--fondo);border-radius:18px;min-height:150px;align-items:center}
.marcador{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%}
.marcador-tit{display:none}
.marcador li{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.mnum{font-family:var(--mono);font-size:14px;opacity:.75;text-align:right}
.marcador .slot{min-height:58px;padding:6px}
.marcador .carta,.parches .carta{padding:10px 14px;font-size:16px}
.parches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}
.parches .slot{min-height:110px}
.pasos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px}
.pasos li{padding:14px 18px;border-radius:16px;background:var(--fondo);font-size:19px;font-weight:500;display:flex;justify-content:space-between;align-items:center;animation:aparece .5s ease both}
.pasos small{font-family:var(--mono);font-size:13px;font-weight:400;opacity:.7}
.receta-tit{font-size:22px;font-weight:500;margin:0}
.lista-pasos{margin:0;padding:0 0 0 28px;display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.lista-pasos li{padding-left:6px}
.lista-pasos button{width:100%;text-align:left;border:2px solid var(--suave);background:var(--blanco);border-radius:14px;padding:12px 16px;font-size:17px}
.lista-pasos button.sel,.exp.sel{border-color:#EF9F27;background:var(--casi-bg)}
.lista-pasos button.bien,.exp.bien{border-color:#3DAA7A;background:var(--ok-bg)}
.huerta{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:16px;border-radius:20px;background:#E9D9C3;width:100%}
.cantero{aspect-ratio:1;border:none;border-radius:16px;background:#C9A27A;display:grid;place-items:center;color:#7A5A2E;padding:4px}
.cantero svg{width:100%;height:100%}
.cantero.tomate svg,.cantero.lechuga svg,.cantero.albahaca svg{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;font-size:16px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda svg{width:26px;height:26px}
.leyenda b{font-family:var(--mono)}
.leyenda .vac{opacity:.7}
.tomateras{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:110px}
.tomateras svg{width:64px;height:80px;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.reparto{display:grid;grid-template-columns:120px 1fr;gap:20px;width:100%;align-items:end}
.pila{display:flex;flex-direction:column;align-items:center;gap:6px}
.pila small{font-family:var(--mono);font-size:13px;opacity:.75}
.pila-p{display:flex;flex-direction:column-reverse;align-items:center;min-height:40px}
.pila-p svg{width:64px;height:16px;margin-top:-6px}
.platos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.plato{border:2px solid var(--suave);background:var(--blanco);border-radius:50% 50% 24px 24px/20% 20% 24px 24px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;padding:10px}
.plato span{font-family:var(--mono);font-size:18px}
.receta{display:flex;flex-direction:column;gap:8px;width:100%;max-width:640px}
.rfila{display:grid;grid-template-columns:110px 1fr 1.4fr;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--fondo)}
.rcab{background:transparent;font-family:var(--mono);font-size:14px;opacity:.75;padding:0 14px}
.rnomb{font-weight:500;font-size:18px}
.rbase,.rnuevo{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:16px;flex-wrap:wrap}
.rbase i,.rnuevo i{display:inline-flex;gap:3px;color:var(--nodo)}
.taza{width:22px;height:22px}
.rnuevo .contador-w{justify-content:flex-start}
.rnuevo .contador-w b{min-width:110px;font-size:17px}
.rnuevo .contador-w button{width:40px;height:40px}
.aparece-v{animation:late .45s cubic-bezier(.3,1.4,.5,1) both;font-weight:500}
.problema{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.problema p{margin:0;padding:16px;border-radius:18px;background:var(--fondo);font-size:16px;line-height:1.3}
.problema b{display:block;font-family:var(--mono);font-size:32px;font-weight:500}
.pregunta.chica{font-size:22px}
.experimentos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.exp{border:2px solid var(--suave);background:var(--blanco);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:left;font-size:15px}
.exp.corta{font-size:18px;justify-content:center;text-align:center;min-height:90px}
.maceta{border-radius:12px;background:var(--fondo);padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.maceta small{font-family:var(--mono);font-size:12px;opacity:.7}
.maceta span{display:flex;align-items:center;gap:6px}
.maceta span svg{width:16px;height:16px}
.maceta span.no{opacity:.6;text-decoration:line-through}
.grupo3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:640px}
.chico{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border-radius:20px;background:var(--fondo);text-align:center;animation:aparece .5s ease both}
.chico:nth-child(2){animation-delay:.12s}.chico:nth-child(3){animation-delay:.24s}
.chico i{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:600;background:var(--blanco);color:var(--boton)}
.chico b{font-size:19px;font-weight:500}
.chico small{font-size:15px;opacity:.8}
.chico.yo-c{outline:2px solid var(--boton)}
.relevo .rimgs{display:flex;gap:6px}
.relevo .rimgs img:nth-child(2){animation-delay:.15s}
.capas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;width:100%;align-items:start}
.capas .vista{background:var(--fondo);border-radius:18px;min-height:230px;align-items:center;padding:10px}
.capas .vacio{font-family:var(--mono);font-size:14px;opacity:.6;margin:0}
.capas .marcador .slot{min-height:46px}
.parches .slot-lbl{font-family:var(--sans);font-size:14px;opacity:.85}
/* Pregunta de cierre */
.pregunta{font-size:28px;font-weight:500;margin:0;text-align:center;max-width:24ch;text-wrap:balance}
.escala{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;width:100%;max-width:720px;align-items:end}
.paso{min-width:0;border:2px solid var(--suave);background:var(--blanco);border-radius:20px;padding:16px 6px 14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;font-size:16px;min-height:150px;transition:border-color .25s, background .25s, opacity .3s, transform .25s}
.paso .barra{width:22px;height:var(--h);border-radius:8px;background:var(--nodo);transition:background .25s, transform .3s;transform-origin:bottom}
.paso:hover:not(:disabled){border-color:var(--nodo);transform:translateY(-3px)}
.paso:hover:not(:disabled) .barra{transform:scaleY(1.12)}
.paso.elegida{border-color:var(--boton);background:var(--fondo);transform:translateY(-4px)}
.paso.elegida .barra{background:var(--boton);animation:crece .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes crece{from{transform:scaleY(.3)}}
.paso.apagada{opacity:.4}
.paso:disabled{cursor:default}
/* Relevo: el profe se presenta */
.relevo{position:fixed;inset:0;z-index:20;background:var(--fondo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.relevo[hidden]{display:none}
.relevo img{width:260px;height:260px;object-fit:contain;animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
.relevo .rnom{font-size:52px;font-weight:600;margin:10px 0 0;letter-spacing:-.01em;animation:sube .5s .25s ease both}
.relevo .rmat{font-family:var(--mono);font-size:17px;margin:0;opacity:.7;animation:sube .5s .4s ease both}
.relevo.on{animation:fundido .3s ease both}
.relevo.sale{animation:fundidoSale .38s ease forwards}
.relevo.sale img{animation:hunde .3s ease-in forwards}
@keyframes fundido{from{opacity:0}}
@keyframes fundidoSale{to{opacity:0}}
/* Apertura */
.apertura{position:fixed;inset:0;z-index:30;background:#E8F6FC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.apertura .logo{width:210px;height:auto;animation:pop .9s .1s cubic-bezier(.3,1.4,.5,1) both}
.apertura h1{font-size:72px;font-weight:600;letter-spacing:-.02em;margin:8px 0 34px;display:flex}

@keyframes letra{from{opacity:0;transform:translateY(22px)}}
.apertura .principal{animation:entraBtn .45s 1.2s cubic-bezier(.3,1.4,.5,1) both}
.apertura.sale{animation:fundidoSale .7s .15s ease forwards;pointer-events:none}
.apertura.sale h1,.apertura.sale .principal{animation:sale .3s ease-in forwards}
body.cerrado .app{visibility:hidden}
body.arranca .voz,body.arranca .tarjeta,body.arranca .acciones{animation:aparece .6s cubic-bezier(.2,.8,.3,1) both}
body.arranca .tarjeta{animation-delay:.35s}
body.arranca .acciones{animation-delay:.5s}
.principal[hidden],.noent[hidden]{display:none}
.principal.espera{background:var(--suave);color:var(--texto);cursor:default}
.noent{min-height:48px;padding:0 18px;border-radius:99px;border:1.5px solid var(--suave);background:var(--blanco);font-size:16px;display:inline-flex;align-items:center;gap:8px}
.noent svg{width:18px;height:18px}
.devolucion{width:100%;border-radius:16px;padding:12px 18px;font-size:18px;text-align:center}
.devolucion.ok{background:var(--ok-bg);color:var(--ok-tx)}
.devolucion.casi{background:var(--casi-bg);color:var(--casi-tx)}

/* Señal de registro */
.anoto{position:fixed;right:28px;bottom:28px;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
.anoto i{width:10px;height:10px;border-radius:50%;background:var(--boton)}
.anoto.on{opacity:.85}
.anoto.on i{animation:destello .6s ease}
@keyframes destello{0%{transform:scale(.4)}60%{transform:scale(1.6);opacity:.4}100%{transform:scale(1)}}

/* Momentos */
.grande{font-size:32px;font-weight:500;margin:0;text-align:center}
.opciones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%;max-width:640px}
.opcion{border:2px solid var(--suave);background:var(--blanco);border-radius:20px;padding:18px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:17px;min-height:140px}
.opcion svg{width:58px;height:58px}
.opcion.elegida{border-color:var(--boton);background:var(--fondo)}
.lectura{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:620px}
.dato{border-radius:20px;background:var(--fondo);padding:18px 20px}
.dato small{display:block;font-family:var(--mono);font-size:13px;opacity:.7;margin-bottom:6px}
.dato b{font-size:24px;font-weight:500}
.dato.dijo{background:transparent;border:1.5px dashed var(--suave)}
.barra-sensor{height:6px;border-radius:3px;background:var(--suave);margin-top:12px;overflow:hidden}
.barra-sensor i{display:block;height:100%;width:0;background:var(--boton);animation:mide 1.6s ease forwards}
@keyframes mide{to{width:100%}}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px}
.plan li{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:14px;padding:14px 18px;border-radius:16px;background:color-mix(in srgb, var(--c) 18%, white);opacity:0;animation:aparece .5s ease forwards}
.plan i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.plan span{font-size:19px;font-weight:500}
.plan time{font-family:var(--mono);font-size:14px;opacity:.75}

/* Equipo de 12 */
.equipo{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:22px;width:100%;align-items:stretch}
.cancha{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:18px;border-radius:20px;background:var(--fondo)}
.cancha.agrupada{grid-template-columns:repeat(var(--g),minmax(0,1fr));gap:16px;background:transparent;padding:0}
.grupo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px;border-radius:20px;background:var(--fondo);align-content:start}
.grupo.fuera{background:transparent;outline:2px dashed var(--suave)}
.jugador{aspect-ratio:1;border:none;background:transparent;padding:0;display:grid;place-items:center;min-width:56px}
.jugador svg{width:100%;max-width:72px;height:auto}
.hueco{aspect-ratio:1;border-radius:50%;border:2px dashed var(--suave);min-width:56px;max-width:72px;justify-self:center;width:100%}
.vestuario{border-radius:20px;border:2px dashed var(--suave);padding:14px;display:flex;flex-direction:column;gap:10px}
.vestuario h3{margin:0;font-size:15px;font-weight:500}
.banco{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-content:start;flex:1}
.banco .jugador{min-width:0}
.banco .jugador svg{max-width:48px;opacity:.75}
.contador{font-family:var(--mono);font-size:16px}
.contador b{font-size:22px;font-weight:500}
.dias2{display:flex;flex-direction:column;gap:14px;width:100%}
.diafila{display:grid;grid-template-columns:110px minmax(0,1fr) 150px;gap:14px;align-items:center;padding:12px 14px;border-radius:20px;border:2px solid transparent;background:var(--fondo)}
.diafila.sel{border-color:var(--boton)}

.diafila h3 small{display:block;font-family:var(--mono);font-size:13px;font-weight:400;opacity:.75}
.fila12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.fila12 .jugador{min-width:0}

.elegir{min-height:52px;border-radius:99px;border:1.5px solid var(--boton);background:var(--blanco);font-size:15px;padding:0 12px}
.diafila.sel .elegir{background:var(--boton);color:#fff}

/* Cuento, lienzo, frase */
.cuento{max-width:62ch;font-size:21px;line-height:1.75;margin:0}
.cuento h3{font-family:var(--mono);font-weight:500;font-size:16px;margin:0 0 10px}

.frag{border-radius:8px;padding:2px 3px;cursor:pointer;transition:background .25s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.frag:hover{background:var(--fondo)}
.frag.suena{background:var(--suave)}
.frag.sel{background:var(--casi-bg);box-shadow:0 0 0 2px #EF9F27}
.frag.bien{background:var(--ok-bg);box-shadow:0 0 0 2px #5DCAA5}
.lienzo{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.lienzo canvas{width:100%;max-width:720px;aspect-ratio:16/7;border:2px dashed var(--suave);border-radius:20px;touch-action:none;cursor:crosshair;background:#fff}
.colores{display:flex;gap:10px;align-items:center}
.color{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--suave);padding:0}
.color.on{box-shadow:0 0 0 3px var(--texto)}
.armada{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.pieza{padding:16px 20px;border-radius:16px;background:var(--fondo);font-size:20px;max-width:300px;animation:entra .5s ease both}
.pieza.porque{background:var(--boton);color:#fff;font-family:var(--mono);font-weight:500}
.etiq{display:block;font-family:var(--mono);font-size:12px;opacity:.7;margin-bottom:4px}
.pieza.porque .etiq{display:none}
.carta{border:2px solid var(--suave);background:var(--blanco);border-radius:16px;padding:14px 16px;font-size:18px;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none;line-height:1.3;cursor:grab}
.carta.sel{border-color:var(--boton);background:var(--fondo)}
.carta.arrastrando{opacity:.35}
.carta.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-2deg);max-width:300px;border-color:var(--boton);box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
.pool{width:100%;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px;border-radius:20px;background:var(--fondo);min-height:70px}
.pool-tit{display:none}
.slot{flex:1;min-height:92px;border:2px dashed var(--nodo);border-radius:18px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px;min-width:0}
.slot.lleno{border-style:solid;border-color:var(--suave)}
.slot .carta{width:100%;cursor:grab}
.slot-lbl{font-family:var(--mono);font-size:13px;opacity:.75;text-align:center}
.slot-vacio{opacity:.55;font-size:15px;text-align:center}
.frase-causa{width:100%;display:flex;align-items:stretch;gap:12px}
.conector{align-self:center;font-family:var(--mono);font-size:22px;font-weight:500;color:#fff;background:var(--boton);padding:10px 16px;border-radius:14px}

/* Simulador */
.wsvg{width:100%;max-width:640px;height:auto;display:block;user-select:none}
.sim-ctrl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.tog{min-height:52px;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--suave);background:var(--blanco);border-radius:99px;padding:0 18px;font-size:16px}
.tog svg{width:22px;height:22px}
.tog.on{border-color:var(--boton);background:var(--fondo)}
.tog.off{opacity:.7;border-style:dashed}
.tog[disabled]{cursor:not-allowed}
.tog .lk2{width:16px;height:16px}
.run{min-height:52px;border:none;background:var(--texto);color:#fff;border-radius:99px;padding:0 22px;font-size:17px;display:inline-flex;gap:8px;align-items:center}
.run svg{width:18px;height:18px}
.run[disabled]{opacity:.5;cursor:wait}
.winfo{font-family:var(--mono);font-size:14px;text-align:center;min-height:1.4em}

/* Recreo, cambios, mañana */
.amigos{display:flex;gap:28px;align-items:center}
.amigo{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:19px;font-weight:500}
.amigo i{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:30px;background:var(--fondo);color:var(--boton)}
.motivo{font-family:var(--mono);font-size:16px;max-width:46ch;text-align:center;opacity:.85;margin:0}
.reloj{font-family:var(--mono);font-size:88px;font-weight:500;letter-spacing:-2px;margin:0}
.cambios{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.cambios section{border-radius:20px;background:var(--fondo);padding:18px 20px}
.cambios h3{margin:0 0 12px;font-size:17px;font-weight:500}
.cambios ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.cambios li{font-size:17px;line-height:1.35}
.cambios s{opacity:.55}
.porque-btn{min-height:48px;border-radius:99px;border:1.5px solid var(--boton);background:transparent;padding:0 18px;font-size:16px}
.respuesta{font-family:var(--mono);font-size:16px;text-align:center;max-width:52ch;margin:0}
.anotado{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:700px}
.anotado li{border-radius:18px;background:var(--fondo);padding:16px 18px;font-size:16px}
.anotado b{display:block;font-family:var(--mono);font-size:30px;font-weight:500;margin-bottom:2px}
.manana{list-style:none;margin:0;padding:0 0 0 6px;display:flex;flex-direction:column;gap:0;width:100%;max-width:420px}
.manana li{position:relative;padding:0 0 26px 30px;opacity:0;animation:aparece .5s ease forwards}
.manana li::before{content:"";position:absolute;left:5px;top:16px;bottom:-2px;width:2px;background:var(--suave)}
.manana li:last-child::before{display:none}
.manana i{position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c)}
.manana span{font-size:18px;font-weight:500}
.manana time{display:block;font-family:var(--mono);font-size:13px;opacity:.7}

/* Panel de prueba (tecla F) */
.panel{position:fixed;top:16px;right:16px;width:340px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;color:#2C2C2A;border-radius:18px;padding:18px;box-shadow:0 20px 50px -20px rgba(0,0,0,.4);z-index:40;font-size:14px;display:flex;flex-direction:column;gap:10px}
.panel[hidden]{display:none}
.panel h2{margin:0;font-size:16px;font-weight:600}
.panel h3{margin:8px 0 0;font-size:14px;font-weight:600}
.panel textarea,.panel select,.panel input[type=text]{width:100%;font:inherit;border:1px solid #D3D1C7;border-radius:10px;padding:8px}
.panel textarea{min-height:70px}
.panel .fila{display:flex;gap:8px;flex-wrap:wrap}
.panel button{border:1px solid #D3D1C7;background:#fff;border-radius:10px;padding:7px 12px}
.panel button.main{background:#2C2C2A;color:#fff;border-color:#2C2C2A}
.panel label{display:flex;gap:8px;align-items:center}
.panel .meta{font-size:12px;color:#5F5E5A}
.panel pre{white-space:pre-wrap;background:#F1EFE8;border-radius:10px;padding:8px;font:12px/1.4 var(--mono);max-height:140px;overflow:auto;margin:0}

@media (max-width:1200px) and (min-width:901px){

}

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const espera = ms => { const tok = S.tok; return new Promise(r => setTimeout(() => { if (tok === S.tok) r(); }, ms)); };

/* ===================== PARÁMETROS ===================== */
// El chico y su día salen del perfil elegido (perfiles.js).
let ALUMNO = "Joaquín", DIA = [];
// Guio es el tutor principal (la clave interna sigue siendo "miseno"); un profe por materia.
const PERSONAS = {
  miseno:   { nombre:"Guio", materia:"Tu tutor", img:"guio", pitch:1.0 },
  mate:     { nombre:"Numi", materia:"Matemática", img:"numi", pitch:1.25 },
  lengua:   { nombre:"Otto", materia:"Lengua", img:"otto", pitch:0.92 },
  ciencias: { nombre:"Fini", materia:"Ciencias", img:"fini", pitch:1.12 },
  dibujo:   { nombre:"Dona", materia:"Dibujo", img:"dona", pitch:1.18 },
  gastro:   { nombre:"Rolo", materia:"Gastronomía", img:"rolo", pitch:0.98 }
};
const ESTADOS = ["reposo", "habla", "piensa", "festeja", "anima"];
const imgDe = (quien, estado) => `img/${PERSONAS[quien].img}-${estado}.webp`;
// Precarga: los cambios de estado no parpadean.
Object.keys(PERSONAS).forEach(q => ESTADOS.forEach(e => { const i = new Image(); i.src = imgDe(q, e); }));

/* ===================== CONFIG Y REGISTRO ===================== */
const CFG_KEY = "miseno-v1-config", LOG_KEY = "miseno-v1-registro";
const CFG = (() => { try { return Object.assign({ voz:"eleven", perfil:"joaquin", vozIds:{} }, JSON.parse(localStorage.getItem(CFG_KEY)) || {}); } catch(e){ return { voz:"eleven", perfil:"joaquin", vozIds:{} }; } })();
const guardarCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); } catch(e){} };
const LOG = { sesion: new Date().toISOString(), eventos: [], notas: [] };
function guardarLog(){ try { localStorage.setItem(LOG_KEY, JSON.stringify(LOG)); } catch(e){} pintarLog(); }
function evento(tipo, datos){ LOG.eventos.push(Object.assign({ t: new Date().toISOString(), momento: M() ? M().id : null, tipo }, datos || {})); guardarLog(); }
// Lo que Miseño registra del chico: deja un destello en la esquina.

  evento("registro", { que, valor });
  const a = $("#anoto"); a.classList.remove("on"); void a.offsetWidth; a.classList.add("on");

/* ===================== VOZ GUIONADA =====================
   Dice exactamente el texto. Una sola voz a la vez: cada frase nueva corta la anterior.
   ElevenLabs (texto a voz) con memoria de audios; si falla, la voz del navegador. */
const AGENT_ID = "agent_9401m714e6nhf2nbf291sjvqfysd";
// OJO: el archivo es público. La clave debería tener solo permisos de texto a voz y lectura de agentes, con tope de créditos.
const VOZ_KEY = "sk_b60db8e141b089c6958790d6f83dc37f3e62e11ebe93cc33";
const VOZ_RESPALDO = "EXAVITQu4vr4xnSDxMaL";
const CACHE = new Map();
let hablaId = 0, audio = null, ultimo = null, vozES = null, vozError = "";
function cargarVoces(){ try { const vs = speechSynthesis.getVoices(); vozES = vs.find(v => /es[-_](AR|UY)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null; } catch(e){} }
if ("speechSynthesis" in window){ cargarVoces(); speechSynthesis.onvoiceschanged = cargarVoces; }
// Subtítulo: la voz dice los números en palabras; en pantalla se escriben como cifras y fracciones.
const SUB = [[/\bdos tercios\b/gi, "2/3"], [/\bun tercio\b/gi, "1/3"], [/\btres cuartos\b/gi, "3/4"], [/\bun cuarto\b/gi, "1/4"], [/\bocho de doce\b/gi, "8 de 12"], [/\bdoce\b/gi, "12"], [/\bocho\b/gi, "8"], [/\bcuatro\b/gi, "4"], [/\btres\b/gi, "3"], [/\bcinco\b/gi, "5"], [/\bveinte\b/gi, "20"]];
const aSubtitulo = t => SUB.reduce((s, [re, r]) => s.replace(re, r), t);
let vozMiseno = null;
async function vozDe(quien){
  if (CFG.vozIds[quien]) return CFG.vozIds[quien];
  if (vozMiseno) return vozMiseno;
  try {
    const r = await fetch(`https://api.elevenlabs.io/v1/convai/agents/${AGENT_ID}`, { headers: { "xi-api-key": VOZ_KEY } });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(); vozMiseno = ((d.conversation_config || {}).tts || {}).voice_id || VOZ_RESPALDO;
  } catch(e){ vozMiseno = VOZ_RESPALDO; }
  return vozMiseno;
}
async function audioDe(texto, quien){
  const voz = await vozDe(quien), clave = voz + "|" + texto;
  if (CACHE.has(clave)) return CACHE.get(clave);
  const r = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voz)}?output_format=mp3_44100_128`, {
    method:"POST", headers:{ "xi-api-key": VOZ_KEY, "Content-Type":"application/json", "Accept":"audio/mpeg" },
    body: JSON.stringify({ text: texto, model_id:"eleven_flash_v2_5", language_code:"es", voice_settings:{ stability:.55, similarity_boost:.8 } })
  });
  if (!r.ok) throw new Error("ElevenLabs respondió " + r.status);
  const url = URL.createObjectURL(await r.blob()); CACHE.set(clave, url); return url;
}
function cortar(){ if (audio){ audio.onended = audio.onerror = null; try { audio.pause(); } catch(e){} audio = null; } try { speechSynthesis.cancel(); } catch(e){} }
// decir(texto, {quien, sub, resaltar}) → promesa que se resuelve cuando termina (o cuando otra frase la corta).
function decir(texto, op){
  op = op || {};
  const id = ++hablaId, quien = op.quien || PERSONA_ACTUAL, tok = S.tok;
  ultimo = { texto, op };
  cortar();
  ponerQuien(quien);
  ponerSub(op.sub || aSubtitulo(texto));
  $("#repetir").hidden = false;
  mascota(quien, op.estado || "habla");
  return new Promise(resolve => {
    let listo = false;
    const fin = () => { if (listo) return; listo = true; if (id === hablaId) mascota(quien, S.quieto); if (tok === S.tok) resolve(id === hablaId); };
    const robot = () => {
      if (CFG.voz === "muda" || !("speechSynthesis" in window)){ setTimeout(fin, Math.min(5200, 700 + texto.length * 45)); return; }
      try {
        const u = new SpeechSynthesisUtterance(texto); u.lang = vozES ? vozES.lang : "es-AR"; if (vozES) u.voice = vozES;
        u.pitch = PERSONAS[quien].pitch; u.rate = 1; u.onend = fin; u.onerror = fin; speechSynthesis.speak(u);
        setTimeout(fin, 2500 + texto.length * 95);
      } catch(e){ fin(); }
    };
    if (CFG.voz !== "eleven"){ robot(); return; }
    audioDe(texto, quien).then(url => {
      if (id !== hablaId) return fin();
      const a = new Audio(url); audio = a; a.onended = fin; a.onerror = fin;
      a.play().then(() => { vozError = ""; pintarPanelVoz(); }).catch(e => { vozError = "el navegador no dejó reproducir"; pintarPanelVoz(); robot(); });
    }).catch(e => { vozError = e.message; pintarPanelVoz(); evento("voz_error", { error: e.message }); if (id === hablaId) robot(); else fin(); });
  });
}
function repetir(){ if (ultimo){ evento("repetir"); decir(ultimo.texto, ultimo.op); } }

/* ===================== PERSONAJES Y MOVIMIENTO =====================
   Cinco estados por personaje: reposo, habla, piensa (mientras el chico resuelve), festeja (acierto),
   anima (error o pedido de ayuda). Al cambiar de personaje, el que se va sale y el nuevo entra. */
let PERSONA_ACTUAL = "miseno";
const MASC = { a:{ q:null, e:null, t:0 }, b:{ q:null, e:null, t:0 } };
function reanimar(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
// En las clases integradoras hay dos profes: el segundo va en el lugar b.
const lugarDe = quien => { const m = M(); return m && m.duo && m.duo[1] === quien ? "b" : "a"; };
function mascota(quien, estado, lugar){
  estado = ESTADOS.includes(estado) ? estado : "reposo";
  lugar = lugar || lugarDe(quien);
  const el = $(lugar === "b" ? "#mascota2" : "#mascota"), X = MASC[lugar];
  if (!el.firstChild) el.innerHTML = `<div class="cuerpo"><img alt=""></div>`;
  const img = el.querySelector("img");
  el.dataset.estado = estado;
  if (X.q !== quien){
    const primera = X.q === null, t = ++X.t; X.q = quien; X.e = estado;
    if (primera){ img.src = imgDe(quien, estado); reanimar(img, "pop"); return; }
    img.classList.remove("pop", "tic"); img.classList.add("sale");
    setTimeout(() => { if (t !== X.t) return; img.classList.remove("sale"); img.src = imgDe(X.q, X.e); reanimar(img, "pop"); }, 230);
    return;
  }
  if (X.e !== estado){ X.e = estado; X.t++; img.classList.remove("sale"); img.src = imgDe(quien, estado); reanimar(img, "tic"); }
}
function duo(m){
  const v = $(".voz"), b = $("#mascota2");
  if (m.duo){ v.classList.add("duo"); b.hidden = false; mascota(m.duo[0], S.quieto, "a"); mascota(m.duo[1], S.quieto, "b"); }
  else { v.classList.remove("duo"); b.hidden = true; MASC.b.q = null; b.innerHTML = ""; mascota(m.quien || "miseno", S.quieto, "a"); }
}
function ponerQuien(quien){
  const q = $("#quien"), p = PERSONAS[quien], m = M(), t = quien === "miseno" ? p.nombre : `${p.nombre} · ${m && m.duo ? "Huerta" : p.materia}`;
  if (q.textContent !== t){ q.textContent = t; reanimar(q, "sube"); }
}
function ponerSub(texto){ const s = $("#sub"); s.textContent = texto; reanimar(s, "sube"); }
// Botones que entran y salen con movimiento.
function verBoton(b, ver){
  clearTimeout(b._t);
  if (ver){ if (b.hidden || b.classList.contains("sale")){ b.hidden = false; b.classList.remove("sale"); reanimar(b, "entra-btn"); } }
  else if (!b.hidden){ b.classList.add("sale"); b._t = setTimeout(() => { b.hidden = true; b.classList.remove("sale"); }, 200); }
}
// Lo que aparece en la tarjeta entra de a uno.
function escalonar(){
  [...tarjeta().children].forEach((c, k) => c.style.setProperty("--n", k));
  tarjeta().querySelectorAll(".opciones,.escala,.amigos,.cambios ul,.anotado").forEach(g => [...g.children].forEach((c, k) => c.style.setProperty("--i", k)));
}
// Relevo: cuando arranca una materia, su profe se presenta en grande.
async function relevo(m){
  const o = $("#relevo"), q = m.duo || [m.quien], ps = q.map(k => PERSONAS[k]);
  o.innerHTML = `<div class="rimgs">${q.map(k => `<img src="${imgDe(k, "festeja")}" alt="">`).join("")}</div><p class="rnom">${ps.map(p => p.nombre).join(" y ")}</p><p class="rmat">${m.duo ? "Clase de la huerta" : "Tu profe de " + ps[0].materia}</p>`;
  o.hidden = false; o.classList.remove("sale"); reanimar(o, "on");
  await espera(1700);
  o.classList.add("sale"); await espera(380); o.hidden = true;
}

/* ===================== LÍNEA DE TIEMPO DEL DÍA ===================== */
const FASES = ["Explorar", "Explicar", "Descubrir", "Mostrame"];
function pintarDia(){
  const m = M(), ol = $("#dia");
  if (S.i < 3){ ol.innerHTML = ""; return; }
  ol.innerHTML = DIA.map((d, k) => {
    const estado = S.hechos.includes(d.id) ? "hecho" : m.nodo === d.id ? "actual" : "pendiente";
    const fases = estado === "actual" && m.fase ? `<ul class="fases" aria-label="Momentos de la clase">${FASES.map((f, j) => { const fi = FASES.indexOf(m.fase); return `<li class="${j < fi ? "ya" : j === fi ? "ahora" : ""}"${j === fi ? ' aria-current="step"' : ""}><i></i>${f}</li>`; }).join("")}</ul>` : "";
    return `<li class="${estado} visible" style="--c:${d.c}" data-k="${k}"><span class="pto"></span><div class="nom">${d.nombre}</div>${d.sub ? `<div class="sub">${d.sub}</div>` : ""}<div class="hora">${d.hora}</div>${fases}</li>`;
  }).join("");
}

/* ===================== MOTOR ===================== */
const S = { tok:0, i:0, quieto:"reposo", meta:{}, hechos:[], errores:0, ayudas:0, met:{}, animo:null, costoMate:false, toques:0, t0:0, dibujo:false };
const M = () => MOMENTOS[S.i];
const tarjeta = () => $("#tarjeta");
function metricas(){ const id = M().nodo; if (!id) return {}; return S.met[id] = S.met[id] || { intentos:0, errores:0, ayudas:0, primerToque:null, inicio:Date.now() }; }
// Cambio de pantalla: lo que está se va y recién después entra lo nuevo.
let pasando = 0;
const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
function mostrar(i){
  const t = ++pasando; S.tok++;
  const vieja = tarjeta(); $("#relevo").hidden = true;
  verBoton($("#principal"), false); $("#principal").onclick = null; verBoton($("#noent"), false);
  if (vieja.children.length && !reducido){ vieja.classList.add("sale"); setTimeout(() => { if (t === pasando) montar(i); }, 280); }
  else montar(i);
}
function montar(i){
  S.i = i; S.errores = 0; S.ayudas = 0; S.nivel = 0; S.toques = 0; S.t0 = Date.now();
  const m = M();
  document.body.dataset.tono = m.tono;
  PERSONA_ACTUAL = m.quien || "miseno";
  S.quieto = m.ayuda ? "piensa" : "reposo";
  pintarDia();
  principal(null);
  S.tok++;
  const vieja = tarjeta(), nueva = vieja.cloneNode(false); nueva.classList.remove("sale"); vieja.replaceWith(nueva);
  evento("momento", { n: i + 1, nombre: m.nombre });
  pintarMeta();
  const arrancar = () => { duo(m); verBoton($("#noent"), !!m.ayuda); m.entrar(); escalonar(); };
  if (m.fase === "Explorar") relevo(m).then(arrancar); else arrancar();
}
function siguiente(){ if (S.i < MOMENTOS.length - 1) mostrar(S.i + 1); }
// Un solo botón principal por pantalla.
function principal(texto, accion){
  const b = $("#principal");
  if (!texto){ verBoton(b, false); b.onclick = null; return; }
  const cambia = !b.hidden && !b.classList.contains("sale") && b.textContent !== texto;
  b.textContent = texto; b.classList.remove("espera"); verBoton(b, true); if (cambia) reanimar(b, "tic");
  b.onclick = () => { if (b.classList.contains("espera")) return; evento("toca", { boton: texto }); accion(); };
}
function marcarToque(){ S.toques++; const mt = metricas(); if (mt && mt.primerToque === null && /Descubrir|Mostrame/.test(M().fase || "")) mt.primerToque = Math.round((Date.now() - S.t0) / 1000); }
function devolucion(texto, tipo){
  let d = tarjeta().querySelector(".devolucion");
  if (!d){ d = document.createElement("div"); tarjeta().appendChild(d); }
  d.className = "devolucion " + tipo; d.textContent = aSubtitulo(texto); reanimar(d, "late");
}
function sacar(el){ if (!el || el.classList.contains("sale")) return; el.classList.add("sale"); setTimeout(() => el.remove(), 220); }
// Errores: primero pista, después "Mirá cómo lo hago yo" y vuelve a probar.
async function errar(m, motivo){
  const mt = metricas(); mt.errores++; S.errores++;
  registrar("error", motivo || "");
  S.nivel++;
  if (S.nivel % 2 === 1){ devolucion(m.pista, "casi"); await decir(m.pista, { estado:"anima" }); }
  else await demostrar(m);
}
async function pedirAyuda(){
  const m = M(); if (!m.ayuda) return;
  const mt = metricas(); mt.ayudas++; S.ayudas++;
  registrar("pidió ayuda", m.nombre);
  S.nivel++;
  if (S.nivel % 2 === 1){ devolucion(m.pista, "casi"); await decir(m.pista, { estado:"anima" }); }
  else await demostrar(m);
}
async function demostrar(m){
  evento("demostracion");
  if (m.demo) await m.demo(); else await decir(m.demoTexto);
}
async function acertar(m, texto, op){
  const mt = metricas(); registrar("logró", m.nombre);
  devolucion(texto, "ok"); S.quieto = "reposo";
  principal("Seguir", siguiente); $("#principal").classList.add("espera");
  await decir(texto, Object.assign({ estado:"festeja" }, op));
  $("#principal").classList.remove("espera");
}

let P = PERFILES[CFG.perfil] || PERFILES.joaquin;
ALUMNO = P.nombre; DIA = P.dia;

function svgPt(svg, ev){
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  return { x: (ev.clientX - r.left) * vb.width / r.width, y: (ev.clientY - r.top) * vb.height / r.height };
}
function mezclar(a, b, t){
  const h = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const A = h(a), B = h(b);

/* ---------- Colocar tarjetas: causa y efecto, ordenar, diagnosticar ---------- */
function wColocar(cfg, ctx){
  let asig = Object.assign({}, cfg.fijas || {}), sel = null, quieto = false, root;
  const fijaCarta = id => Object.values(cfg.fijas || {}).includes(id);
  const enUso = id => Object.values(asig).includes(id);
  const carta = c => `<button class="carta${sel === c.id ? " sel" : ""}${fijaCarta(c.id) ? " fija" : ""}" data-card="${c.id}">${esc(c.t)}</button>`;
  function slotHTML(s, conLabel){
    const c = cfg.cartas.find(x => x.id === asig[s.id]);
    return `<div class="slot${c ? " lleno" : ""}" data-slot="${s.id}">${s.arriba || ""}${conLabel !== false && s.label ? `<span class="slot-lbl">${esc(s.label)}</span>` : ""}${c ? carta(c) : `<span class="slot-vacio">${esc(s.vacio || "Arrastrá una tarjeta acá")}</span>`}</div>`;
  }
  function dibujar(){
    let mid;
    if (cfg.layout === "causa") mid = `<div class="frase-causa">${slotHTML(cfg.slots[0])}<span class="conector">${esc(cfg.conector || "porque")}</span>${slotHTML(cfg.slots[1])}</div>`;
    else if (cfg.layout === "parches") mid = `<div class="parches">${cfg.slots.map(s => slotHTML(s)).join("")}</div>`;
    else mid = `<ol class="marcador">${cfg.titulo ? `<div class="marcador-tit">${esc(cfg.titulo)}</div>` : ""}${cfg.slots.map(s => `<li><span class="mnum">${esc(s.label)}</span>${slotHTML(s, false)}</li>`).join("")}</ol>`;
    const pool = cfg.cartas.filter(c => !enUso(c.id));
    root.innerHTML = mid + `<div class="pool" data-pool><span class="pool-tit">Tarjetas</span>${pool.map(carta).join("") || '<span class="slot-vacio">¡Usaste todas las tarjetas!</span>'}</div>`;
  }
  function colocar(cardId, slotId){
    if (fijaCarta(cardId) || (slotId && cfg.fijas && cfg.fijas[slotId])) { sel = null; dibujar(); return; }
    for (const k in asig) if (asig[k] === cardId) delete asig[k];
    if (slotId) asig[slotId] = cardId;
    sel = null; dibujar(); ctx.cambio({ tipo:"colocar", carta:cardId, slot:slotId });
  }
  return {
    mount(el){
      root = document.createElement("div"); root.style.cssText = "width:100%;display:flex;flex-direction:column;gap:12px"; el.appendChild(root); dibujar();
      root.addEventListener("pointerdown", ev => {
        if (quieto) return;
        const card = ev.target.closest("[data-card]");
        if (card){
          const id = card.dataset.card; if (fijaCarta(id)) return;
          const x0 = ev.clientX, y0 = ev.clientY; let ghost = null;
          const mv = e => {
            if (!ghost && Math.hypot(e.clientX - x0, e.clientY - y0) > 8){ ghost = card.cloneNode(true); ghost.classList.add("ghost"); document.body.appendChild(ghost); card.classList.add("arrastrando"); }
            if (ghost){ ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px"; }
          };
          const up = e => {
            window.removeEventListener("pointermove", mv); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
            if (ghost){
              ghost.remove();
              const dest = document.elementFromPoint(e.clientX, e.clientY), sl = dest && dest.closest("[data-slot]");
              if (sl && root.contains(sl)) colocar(id, sl.dataset.slot);
              else if (dest && dest.closest("[data-pool]")) colocar(id, null);
              else dibujar();
              return;
            }
            const enSlot = card.closest("[data-slot]");
            if (enSlot && sel && sel !== id){ colocar(sel, enSlot.dataset.slot); return; }
            if (enSlot && !sel){ colocar(id, null); return; }
            sel = sel === id ? null : id; dibujar();
          };
          window.addEventListener("pointermove", mv); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
          ev.preventDefault(); return;
        }
        const sl = ev.target.closest("[data-slot]");
        if (sl && sel) colocar(sel, sl.dataset.slot);
      });
    },
    get: () => ({ asig: Object.assign({}, asig) }),
    set(n){ asig = Object.assign({}, cfg.fijas || {}, n.asig || {}); sel = null; dibujar(); },
    bloquear(){ quieto = true; }
  };
}

const PASTO = {
  nuevo:   { color:"#6CBF84", alto:.42, curva:.12, ancho:5, nombre:"pasto nuevo" },
  verde:   { color:"#2E9E5B", alto:1, curva:.12, ancho:5.5, nombre:"verde y fuerte" },
  amarillo:{ color:"#DCC75A", alto:.95, curva:.22, ancho:2.6, nombre:"amarillo y flaquito" },
  seco:    { color:"#B48A55", alto:.32, curva:.45, ancho:4, nombre:"marrón y seco" },
  marchito:{ color:"#8E9E55", alto:.55, curva:1.1, ancho:4.5, nombre:"marchito y caído" }
};
function resultadoPasto(st){
  const luz = st.luz || st.lampara, faltan = [!luz, !st.agua, !st.aire].filter(Boolean).length;
  if (!faltan) return "verde";
  if (faltan > 1 || !st.agua) return "seco";
  if (!luz) return "amarillo";
  return "marchito";
}
function pastoSVG(res, x0, x1, yb, hmax, t){
  const A = PASTO.nuevo, Z = PASTO[res] || A, L = (a, b) => a + (b - a) * t, col = mezclar(A.color, Z.color, t);
  let h = ""; const n = 30;
  for (let i = 0; i < n; i++){
    const x = x0 + (x1 - x0) * (i + .5) / n + ((i * 37) % 7 - 3);
    const alto = hmax * L(A.alto, Z.alto) * (.72 + ((i * 53) % 10) / 34);
    const curva = L(A.curva, Z.curva) * (i % 2 ? 1 : -1) * alto;
    h += `<path d="M${x} ${yb} q${curva * .25} ${-alto * .6} ${curva} ${-alto}" stroke="${col}" stroke-width="${L(A.ancho, Z.ancho)}" fill="none" stroke-linecap="round"/>`;
  }
  return h;
}

  const COL = ["#534AB7", "#0F6E56", "#D85A30", "#185FA5", "#2C2C2A"];
  el.innerHTML = `<div class="lienzo"><canvas width="960" height="420" aria-label="Lienzo para dibujar"></canvas><div class="colores">${COL.map((c, i) => `<button class="color${i ? "" : " on"}" data-c="${c}" style="background:${c}" aria-label="Color ${i + 1}"></button>`).join("")}<button class="noent" data-borrar>Borrar</button></div></div>`;
  const cv = el.querySelector("canvas"), g = cv.getContext("2d"); let col = COL[0], dib = false, u = null, trazos = 0;
  g.lineCap = g.lineJoin = "round"; g.lineWidth = 8;
  const pt = e => { const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * cv.width / r.width, y:(e.clientY - r.top) * cv.height / r.height }; };
  cv.addEventListener("pointerdown", e => { dib = true; u = pt(e); cv.setPointerCapture(e.pointerId); g.fillStyle = col; g.beginPath(); g.arc(u.x, u.y, 4, 0, 7); g.fill(); });
  cv.addEventListener("pointermove", e => { if (!dib) return; const p = pt(e); g.strokeStyle = col; g.beginPath(); g.moveTo(u.x, u.y); g.lineTo(p.x, p.y); g.stroke(); u = p; });
  const fin = () => { if (dib){ dib = false; trazos++; S.dibujo = true; if (trazos === 1){ marcarToque(); registrar("empezó a dibujar"); } } };
  cv.addEventListener("pointerup", fin); cv.addEventListener("pointercancel", fin);

  return { trazos: () => trazos };
}

};
// Quién da cada clase, para los pases de una a otra.
const profesDe = id => { if (id === "huerta"){ const l = P.lecciones.map(k => LECCIONES[k]).find(l => l.nodo === "huerta"); return l.duo; } return [id]; };
function pase(nodo){
  const k = DIA.findIndex(d => d.id === nodo), sig = DIA[k + 1];
  if (!sig) return "";
  if (sig.id === "recreo") return "Ahora, recreo.";
  const ps = profesDe(sig.id).map(q => PERSONAS[q].nombre);
  return sig.id === "huerta" ? `Ahora viene la clase de la huerta, con ${ps.join(" y ")}.` : `Ahora te dejo con ${ps[0]}, tu profe de ${PERSONAS[sig.id].materia}.`;
}
function cierre(nodo, cfg){
  const c = Object.assign({}, CIERRES[cfg.tipo], cfg), materia = DIA.find(d => d.id === nodo).nombre;
  return { id:nodo + "-cierre", nombre:`Cierre de ${materia}: pregunta`, tono:nodo, nodo, quien:"miseno",
    entrar(){
      completarNodo(nodo);

      decir(c.pregunta);
      tarjeta().onclick = async ev => {
        const b = ev.target.closest("[data-v]"); if (!b || S.meta[nodo]) return;
        const v = Number(b.dataset.v); S.meta[nodo] = { valor:v, texto:c.opciones[v - 1] };
        tarjeta().querySelectorAll("[data-v]").forEach(x => { x.disabled = true; x.classList.add(x === b ? "elegida" : "apagada"); });
        registrar(`respondió: ${c.pregunta}`, c.opciones[v - 1]);
        const [r, estado] = c.responde(v);
        await decir((r + " " + pase(nodo)).trim(), { estado });
        principal("Seguir", siguiente);
      };
    } };
}

        tarjeta().innerHTML = `<p class="reloj" id="reloj" aria-label="Hora">10:20</p><p class="motivo">Recreo</p>`;
        ponerSub("Recreo"); $("#repetir").hidden = true;
        for (let m = 21; m <= 40; m++){ await espera(110); $("#reloj").textContent = "10:" + m; }
        completarNodo("recreo"); registrar("volvió del recreo", "10:40");
        await espera(500); await decir(`Bienvenid${oa()} de vuelta. ${pase("recreo")}`); siguiente();
      });
    } },
  cambios: { id:"cambios", nombre:"Lo que cambió hoy", tono:"miseno", quien:"miseno",
    async entrar(){
      const costo = P.costo(), c = P.cambios(costo);
      tarjeta().innerHTML = `<div class="cambios">
        <section><h3>Tu camino</h3><ul>${c.camino.map(t => `<li>${esc(t)}</li>`).join("")}</ul></section>
        <section><h3>Tu perfil</h3><ul>${c.perfil.map(t => `<li>${esc(t)}</li>`).join("")}${S.dibujo ? "<li>Nuevo: te gusta dibujar escenas</li>" : ""}</ul></section></div>
        <button class="porque-btn" id="porque">¿Por qué?</button><p class="respuesta" id="resp" hidden></p>`;
      registrar("cambió tu camino y tu perfil");
      $("#porque").onclick = async () => {
        registrar("preguntó por qué");
        const r = $("#resp"); r.hidden = false; r.textContent = aSubtitulo(c.porque); reanimar(r, "late"); await decir(c.porque);
      };
      await decir("Esto cambió hoy en tu camino.");
      principal("Seguir", siguiente);
    } },
  proyecto: { id:"proyecto", nombre:"El proyecto de mañana", tono:"huerta", quien:"miseno",
    async entrar(){
      const ROLES = { "Joaquín":"Escribe las recetas", "Sofía":"Ilustra y hace las cuentas", "Bruno":"Elige qué se cocina" };
      const chicos = [P.nombre, ...P.amigos];
      tarjeta().innerHTML = `<p class="grande">${PROYECTO.nombre}</p><div class="grupo3">${chicos.map(n => `<div class="chico${n === P.nombre ? " yo-c" : ""}"><i>${n[0]}</i><b>${n === P.nombre ? "Vos" : n}</b><small>${ROLES[n]}</small></div>`).join("")}</div>
        <button class="porque-btn" id="porque">¿Por qué con ellos?</button><p class="respuesta" id="resp" hidden></p>`;
      registrar("armó el grupo del proyecto", chicos.join(", "));
      $("#porque").onclick = async () => {
        registrar("preguntó por qué ese grupo");
        const t = "Los junté porque cada uno sabe algo que a los otros les cuesta. " + P.rol;
        const r = $("#resp"); r.hidden = false; r.textContent = t; reanimar(r, "late"); await decir(t);
      };
      await decir(`Mañana empezás un proyecto con ${lista(P.amigos)}: ${PROYECTO.nombre.toLowerCase()}. Van a ver qué crece en la huerta, calcular cuánto hace falta, cocinar, dibujar y escribir las recetas.`);
      principal("Seguir", siguiente);
    } },
  manana: { id:"manana", nombre:"Mañana", tono:"miseno", quien:"miseno",
    async entrar(){
      const l = P.manana(P.costo());
      tarjeta().innerHTML = `<p class="grande">Mañana</p><ol class="manana">${l.map((d, k) => `<li style="--c:${d.c};animation-delay:${0.4 + k * 0.5}s"><i></i><span>${esc(d.n)}</span><time>${d.h}</time></li>`).join("")}</ol>`;
      registrar("armó el día de mañana");
      await decir(`Ya armé tu día de mañana. Nos vemos, ${ALUMNO}.`);
      registrar("salida", new Date().toTimeString().slice(0, 5));
    } }
};

/* ===================== EL RECORRIDO DE CADA PERFIL =====================
   saludo → ánimo → sensores → día → clase 1 → cierre → clase 2 → cierre → recreo → huerta → cierre
   → lo que cambió → el proyecto → mañana */
let MOMENTOS = [];
function armar(){
  const [l1, l2, l3] = P.lecciones.map(k => LECCIONES[k]);
  const clase = l => [...l.momentos(), cierre(l.nodo, l.cierre)];
  MOMENTOS = [COMUNES.saludo, COMUNES.animo, COMUNES.sensores, COMUNES.tuDia, ...clase(l1), ...clase(l2), COMUNES.recreo, ...clase(l3), COMUNES.cambios, COMUNES.proyecto, COMUNES.manana];
}
armar();

// Botón Listo de Matemática · Descubrir (también vuelve después de la demostración).
function listoMate(m){
  principal("Listo", async () => {
    const n = m._eq.st.fuera.size, mt = metricas(); mt.intentos++;
    if (n === 8){ m._eq.bloquear(); return acertar(m, "¡Eso! Faltaron ocho de doce: dos tercios del equipo."); }
    await errar(m, n + " en el vestuario");
  });
}
// Ejemplo de la demostración de Lengua: la frase de los cordones armada.
function crearWidgetDemo(){
  const d = document.createElement("div"); d.className = "armada";
  d.innerHTML = `<div class="pieza"><span class="etiq">Lo que pasa</span>Lucía se ataba los cordones dos veces</div><div class="pieza porque">porque</div><div class="pieza"><span class="etiq">El motivo</span>se le había salido el botín</div>`;
  tarjeta().innerHTML = ""; tarjeta().appendChild(d); return d;
}

/* ===================== PANEL DE PRUEBA Y TECLADO ===================== */
function pintarMeta(){ const m = M(); $("#pMeta").textContent = `Momento ${S.i + 1} de ${MOMENTOS.length}: ${m.nombre}`; }
function pintarLog(){ const p = $("#pLog"); if (p) p.textContent = LOG.eventos.slice(-8).map(e => e.t.slice(11, 19) + " " + e.tipo + (e.que ? ": " + e.que : "") + (e.nombre ? ": " + e.nombre : "")).join("\n"); }
function pintarPanelVoz(){
  document.querySelectorAll("[name=voz]").forEach(r => r.checked = r.value === CFG.voz);
  document.querySelectorAll("[name=perfil]").forEach(r => r.checked = r.value === CFG.perfil);
  $("#pVoz").textContent = CFG.voz === "eleven" ? (vozError ? "Falló ElevenLabs (" + vozError + "): esa frase salió con la voz del navegador." : "La voz de ElevenLabs lee exactamente el guion. Cada frase se paga una sola vez.") : CFG.voz === "navegador" ? "Voz del navegador: no gasta créditos." : "Sin voz: los subtítulos avanzan solos.";
}
function abrirPanel(){ const p = $("#panel"); p.hidden = !p.hidden; if (!p.hidden){ pintarMeta(); pintarLog(); pintarPanelVoz(); $("#pNota").focus(); } }
$("#pSaltar").innerHTML = MOMENTOS.map((m, i) => `<option value="${i}">${i + 1}. ${m.nombre}</option>`).join("");
$("#pIr").onclick = () => {
  const i = Number($("#pSaltar").value);
  if (i >= 2) S.animo = S.animo || "contento";
  S.hechos = DIA.map(d => d.id).filter(id => { const ult = MOMENTOS.map((m, k) => m.nodo === id ? k : -1).reduce((x, y) => Math.max(x, y)); return ult < i; });
  cortar(); hablaId++; $("#panel").hidden = true; cerrarApertura(true); mostrar(i);
};
$("#pReiniciar").onclick = () => location.reload();
$("#pGuardar").onclick = () => { const t = $("#pNota").value.trim(); if (!t) return; LOG.notas.push({ t: new Date().toISOString(), momento: M().id, nota: t }); guardarLog(); $("#pNota").value = ""; $("#pMeta").textContent = "Nota guardada. " + $("#pMeta").textContent; };
$("#pCerrar").onclick = () => { $("#panel").hidden = true; };
$("#pCopiar").onclick = async () => { const t = JSON.stringify(LOG, null, 2); try { await navigator.clipboard.writeText(t); $("#pVoz").textContent = "Registro copiado."; } catch(e){ $("#pLog").textContent = t; } };
document.querySelectorAll("[name=voz]").forEach(r => r.onchange = () => { CFG.voz = r.value; guardarCfg(); cortar(); pintarPanelVoz(); });
document.querySelectorAll("[name=perfil]").forEach(r => r.onchange = () => cambiarPerfil(r.value));
/* Cambio de perfil, escondido: tocar el avatar del chico arriba de la línea del día. */
function cambiarPerfil(id){ if (!PERFILES[id]) return; CFG.perfil = id; guardarCfg(); try { sessionStorage.setItem("miseno-sin-apertura", "1"); } catch(e){} location.reload(); }
function pintarYo(){
  $("#yo").textContent = P.inicial; $("#yo").setAttribute("aria-label", `${P.nombre}. Cambiar de perfil`);
  $("#perfiles").innerHTML = Object.entries(PERFILES).map(([id, p]) => `<button data-perfil="${id}"${p === P ? ' aria-current="true"' : ""}><i>${p.inicial}</i>${p.nombre}<small>${p.edad} años</small></button>`).join("");
}
$("#yo").onclick = () => { const l = $("#perfiles"); l.hidden = !l.hidden; if (!l.hidden) reanimar(l, "late"); };
$("#perfiles").onclick = e => { const b = e.target.closest("[data-perfil]"); if (b) cambiarPerfil(b.dataset.perfil); };
pintarYo();
$("#repetir").onclick = repetir;
$("#noent").onclick = () => pedirAyuda();
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === "f" || e.key === "F"){ e.preventDefault(); abrirPanel(); return; }
  if (e.shiftKey && (e.key === "R")){ location.reload(); return; }
  if (e.key === "r"){ repetir(); return; }
  if ((e.key === "n" || e.key === "N") && !$("#noent").hidden){ pedirAyuda(); return; }
  if (e.key === "Enter" && !$("#principal").hidden && !e.target.closest("button")){ $("#principal").click(); }
});
/* ===================== APERTURA =====================
   Logo y nombre de la plataforma. El toque en Empezar habilita el audio y el pájaro del logo
   vuela hasta el lugar de Guio. */
let abierta = false;
function cerrarApertura(rapido){
  if (abierta) return; abierta = true;
  const ap = $("#apertura"), logo = ap.querySelector(".logo");
  document.body.classList.remove("cerrado");
  if (rapido || reducido){ ap.remove(); return; }
  const a = logo.getBoundingClientRect(), b = $("#mascota").getBoundingClientRect();
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2), k = b.width / a.width;
  logo.animate([{ transform:"none", opacity:1 }, { transform:`translate(${dx}px, ${dy}px) scale(${k})`, opacity:0 }], { duration:750, easing:"cubic-bezier(.6,0,.25,1)", fill:"forwards" });
  ap.classList.add("sale"); document.body.classList.add("arranca");
  setTimeout(() => ap.remove(), 800);
}
$("#empezar").onclick = () => { evento("toca", { boton:"Empezar (apertura)" }); cerrarApertura(); setTimeout(() => mostrar(0), 450); };
// Al cambiar de perfil no se repite la apertura: arranca el día del chico nuevo.
let sinApertura = false; try { sinApertura = sessionStorage.getItem("miseno-sin-apertura") === "1"; sessionStorage.removeItem("miseno-sin-apertura"); } catch(e){}
if (sinApertura){ cerrarApertura(true); evento("perfil", { perfil:P.nombre }); setTimeout(() => mostrar(0), 300); }
setTimeout(() => { const e = $("#empezar"); if (e) e.focus({ preventScroll:true }); }, 1300);

</script>
