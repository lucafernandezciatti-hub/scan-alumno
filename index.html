<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan · App del alumno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<!--
  SCAN · APP DEL ALUMNO — prototipo v0.1
  Diseño Interactivo (UTDT) · escenario "Enseñanza Scan 360" · PRD: https://claude.ai/artifact/JMZs6eA4rMs8cpASa4mdSJ

  Idea: tutor de voz para alumnos de primaria. Saluda, pregunta cómo estás, te lleva por los bloques
  del día que eligió el sistema y cambia de método cuando no entendés. Nunca muestra por qué decide.

  Cómo se usa
    Mouse/táctil: caritas, botones grandes, barra inferior.
    Voz: mantener apretado el micrófono (o la barra espaciadora) y hablar. Si el navegador no deja usar
         el micrófono (por ejemplo, dentro de claude.ai), todo se puede hacer con botones.
    Teclado: 1–4 ánimo · 1–3 responder · N no entiendo · R repetir · F nota de prueba · Shift+R reiniciar alumno.

  Cambios por versión
    v0.1 (2/11/2026): check-in con voz, respiración, plan del día, bloque de Matemática (fracciones)
                      con "No entiendo" y 3 métodos, indicador Scan, vista de pulsera, notas de prueba.
    v0.4.4 (9/11/2026): prueba también por WebSocket; botón "Diagnosticar conexión" en el panel F.
    v0.4.3 (9/11/2026): si ElevenLabs rechaza el guion de la app (overrides), reintenta con el del panel.
    v0.4.2 (9/11/2026): el Agent ID de Miseño viene cargado; para el modo real alcanza con elegir "Real".
    v0.4.1 (9/11/2026): el tutor de IA se llama Miseño (guion del modo real).
    v0.4 (9/11/2026): modo real con IA de voz (agente de ElevenLabs que habla, escucha y mueve la app con
                      herramientas, siguiendo el guion de cada pantalla) y modo testing con la voz robótica.
                      El modo se cambia en el panel de notas (tecla F). Si el modo real falla, vuelve a testing.
    v0.3 (9/11/2026): recorrido guiado y secuencial: Lección → Mi camino → Mi perfil → Agenda → Recreo.
                      Cada etapa se desbloquea al terminar la anterior; cada pantalla muestra primero
                      "lo que cambió". Avisos se reemplaza por Agenda; nuevo chat del recreo con amigos.
                      Ciencias pasa a después del recreo.
    v0.2 (3/11/2026): bloques de Lengua (cuento "La arquera") y Ciencias (plantas, cierre con grupo de huerta);
                      motor de bloques con opciones de texto y voz por palabras clave; Mi camino (¿Por qué?
                      genérico, Música en pausa), Mi perfil Scan y Avisos; teclas 1–3 para responder; fin del día.

  Ideas pendientes (ver PRD): límite emocional (v0.3);
  proyecto grupal y modos de la pulsera (después).
-->
<style>
:root{
  /* Mundo Scan: superficie cálida y amable, un solo azul que "mira". Vidrio translúcido sobre crema.
     Layout: escenario del tutor a la izquierda, pulsera y lectura Scan a la derecha, navegación abajo. */
  --bg:#F4EFE6;
  --bg-deep:#EAE2D4;
  --glass:rgba(255,255,255,.62);
  --glass-line:rgba(255,255,255,.9);
  --ink:#1F2733;
  --ink-soft:#5E6878;
  --scan:#2F6BE0;
  --scan-soft:#DCE7FB;
  --good:#2E9E6B;
  --warn:#D9822B;
  --radius:22px;
  --font-display:"Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 700px at 85% -10%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
    radial-gradient(900px 600px at -10% 110%, var(--bg-deep) 0%, rgba(234,226,212,0) 70%),
    var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:18px;
  line-height:1.45;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--scan);outline-offset:3px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;max-width:1280px;margin:0 auto}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:.5px}
.brand-mark{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,var(--scan) 60%,#1F4FB0 100%);box-shadow:0 0 0 4px var(--scan-soft)}
.top-right{display:flex;align-items:center;gap:14px;color:var(--ink-soft);font-size:16px}
.who{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:6px 14px 6px 6px;color:var(--ink)}
.avatar{width:34px;height:34px;border-radius:50%;background:#F3C98B;display:grid;place-items:center;font-family:var(--font-display);font-weight:600}
.toggle{border:1px solid var(--glass-line);background:var(--glass);border-radius:999px;padding:8px 14px;font-size:15px}
.toggle[aria-pressed="false"]{color:var(--ink-soft);text-decoration:line-through}

/* Cuerpo */
.main{display:grid;grid-template-columns:1fr 300px;gap:24px;padding:14px 28px;min-height:0}
.stage{position:relative;background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;gap:0;
  box-shadow:0 20px 60px -30px rgba(31,39,51,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;align-items:center;padding:22px 28px 20px;min-height:0;overflow:auto}
.aside{display:flex;flex-direction:column;gap:18px;min-height:0}

/* Tutor */
.tutor{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.orb-wrap{position:relative;width:120px;height:120px;display:grid;place-items:center;flex:none}
.orb{width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#FFFFFF 0 12%,#BFD3FA 28%,var(--scan) 64%,#1D47A3 100%);
  box-shadow:0 0 0 10px rgba(47,107,224,.10),0 18px 40px -12px rgba(47,107,224,.55);
  animation:idle 5s ease-in-out infinite;transition:transform 4s ease-in-out}
.orb-wrap.speaking .orb{animation:talk .9s ease-in-out infinite}
.orb-wrap.listening::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--scan);animation:ring 1.2s ease-out infinite}
.orb-wrap.breath .orb{animation:none}
@keyframes idle{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes talk{0%,100%{transform:scale(1);box-shadow:0 0 0 10px rgba(47,107,224,.10),0 18px 40px -12px rgba(47,107,224,.55)}50%{transform:scale(1.06);box-shadow:0 0 0 18px rgba(47,107,224,.14),0 18px 40px -12px rgba(47,107,224,.7)}}
@keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.15);opacity:0}}
.caption{font-family:var(--font-display);font-size:28px;font-weight:500;line-height:1.3;text-align:center;max-width:30ch;text-wrap:balance;min-height:1.3em}
.caption small{display:block;font-family:var(--font-body);font-size:17px;font-weight:400;color:var(--ink-soft);margin-top:6px}
.repeat{border:none;background:none;color:var(--scan);font-size:16px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px}
.repeat:hover{background:var(--scan-soft)}

.stage.compact .tutor{flex-direction:row;justify-content:center;gap:18px;text-align:left}
.stage.compact .orb-wrap{width:72px;height:72px}
.stage.compact .orb{width:56px;height:56px;box-shadow:0 0 0 6px rgba(47,107,224,.10),0 10px 24px -10px rgba(47,107,224,.55)}
.stage.compact .caption{font-size:22px;text-align:left;max-width:40ch}
.stage.compact .content{margin-top:12px}
.content{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:14px;flex:1}

/* Botones grandes */
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
.big{min-width:120px;min-height:72px;padding:12px 26px;border-radius:20px;border:2px solid transparent;background:#fff;
  font-family:var(--font-display);font-size:26px;font-weight:500;box-shadow:0 6px 0 #D9D2C4;transition:transform .08s, box-shadow .08s}
.big:hover{border-color:var(--scan-soft)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #D9D2C4}
.big.primary{background:var(--scan);color:#fff;box-shadow:0 6px 0 #1D47A3}
.big.primary:active{box-shadow:0 2px 0 #1D47A3}
.big.ghost{background:transparent;box-shadow:none;border-color:#D9D2C4;font-size:20px;min-height:60px}
.big.right{background:var(--good);color:#fff;box-shadow:0 6px 0 #1F7550}
.big.wrong{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.mood{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:16px;width:100%}
.mood button{border:2px solid transparent;background:#fff;border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 #D9D2C4;font-size:19px}
.mood button:hover{border-color:var(--scan-soft)}
.mood svg{width:60px;height:60px}
.key{font-size:13px;color:var(--ink-soft)}

/* Plan del día */
.plan{width:100%;display:flex;flex-direction:column;gap:12px}
.plan-item{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;background:#fff;border-radius:20px;padding:14px 18px}
.plan-item .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-family:var(--font-display);font-size:24px;font-weight:600}
.plan-item h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:24px}
.plan-item p{margin:2px 0 0;color:var(--ink-soft);font-size:16px}
.plan-item .mins{font-family:var(--font-display);font-size:22px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.plan-item.now{outline:3px solid var(--scan)}
.plan-item.done{opacity:.55}
.plan-item.done h3{text-decoration:line-through}
.plan-item .lock{font-size:14px;color:var(--ink-soft)}

/* Bloque */
.block-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px;font-size:15px}
.progress{flex:1;min-width:140px;height:10px;border-radius:99px;background:#E4DDCF;overflow:hidden}
.progress i{display:block;height:100%;background:var(--scan);border-radius:99px;transition:width .5s}
.problem{width:100%;background:#fff;border-radius:24px;padding:22px 26px;font-size:24px;line-height:1.4;text-align:center}
.problem .frac{font-family:var(--font-display);font-weight:600;color:var(--scan);white-space:nowrap}
.method-tag{font-size:14px;color:var(--ink-soft);letter-spacing:.3px}
.visual{width:100%;background:#fff;border-radius:24px;padding:18px}
.visual svg{width:100%;height:auto;display:block}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;align-items:center;margin-top:auto;padding-top:8px}
.noent{background:#FFF4E5;border:2px solid #F3C98B;color:#7A4A12;border-radius:20px;padding:12px 22px;font-family:var(--font-display);font-size:22px;font-weight:500;display:inline-flex;align-items:center;gap:10px}
.noent:hover{background:#FFEBD0}

.mic{width:84px;height:84px;border-radius:50%;border:none;background:var(--scan);color:#fff;display:grid;place-items:center;box-shadow:0 6px 0 #1D47A3;touch-action:none}
.mic svg{width:36px;height:36px}
.mic.on{background:#D64545;box-shadow:0 6px 0 #9C2B2B}
.mic[disabled]{background:#C9C2B5;box-shadow:none;cursor:not-allowed}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;color:var(--ink-soft);max-width:180px;text-align:center}
.heard{font-size:15px;color:var(--ink-soft);min-height:1.4em}

.banner{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#fff;border-radius:18px;padding:12px 16px 12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 40px -18px rgba(31,39,51,.45);font-size:17px;z-index:5;max-width:90%}
.banner button{border:none;background:var(--scan);color:#fff;border-radius:12px;padding:8px 14px}

.celebrate{font-family:var(--font-display);font-size:64px;color:var(--good)}
.note-card{background:#fff;border-radius:22px;padding:22px 26px;max-width:520px;text-align:center;color:var(--ink-soft)}
.note-card strong{display:block;font-family:var(--font-display);font-weight:500;font-size:24px;color:var(--ink);margin-bottom:6px}

/* Pulsera */
.panel{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--radius);padding:16px 18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.panel h2{margin:0 0 10px;font-family:var(--font-display);font-weight:500;font-size:17px;color:var(--ink-soft);letter-spacing:.3px}
.band{position:relative;height:150px;display:grid;place-items:center}
.band::before{content:"";position:absolute;left:-18px;right:-18px;top:50%;height:58px;transform:translateY(-50%);border-radius:30px;background:linear-gradient(180deg,#3A4252,#232A35)}
.band-face{position:relative;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#0F1A2E,#05090F);border:6px solid #8E96A3;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#EAF1FF;padding:12px;transition:transform .2s}
.band-face.buzz{animation:buzz .5s}
@keyframes buzz{20%,60%{transform:translateX(-3px) rotate(-2deg)}40%,80%{transform:translateX(3px) rotate(2deg)}}
.band-main{font-family:var(--font-display);font-size:21px;font-weight:500;line-height:1.1}
.band-sub{font-size:12px;color:#9EB4DE;margin-top:4px;font-variant-numeric:tabular-nums}
.band-mode{position:absolute;bottom:16px;display:flex;align-items:center;gap:4px;font-size:10px;color:#7FA2E8;letter-spacing:.6px;text-transform:uppercase}
.band-mode i{width:6px;height:6px;border-radius:50%;background:#5B8CF0;box-shadow:0 0 6px #5B8CF0}

.reading{display:flex;flex-direction:column;gap:10px}
.meter{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:10px;font-size:15px}
.dots{display:flex;gap:6px}
.dots b{width:100%;height:10px;border-radius:5px;background:#E1DACC;transition:background .4s}
.dots b.on{background:var(--scan)}
.dots.low b.on{background:var(--warn)}
.reading-note{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--scan);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

.mini-plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.mini-plan li{display:flex;justify-content:space-between;gap:8px}
.mini-plan li.now{color:var(--scan);font-weight:700}
.mini-plan li.done{color:var(--ink-soft);text-decoration:line-through}

/* Navegación */
.nav{display:flex;justify-content:center;gap:10px;padding:8px 28px 20px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:110px;padding:8px 14px;border:none;background:transparent;border-radius:16px;color:var(--ink-soft);font-size:15px}
.nav button svg{width:28px;height:28px}
.nav button[aria-current="page"]{background:var(--glass);color:var(--scan);font-weight:700}
.badge{position:absolute;top:4px;right:30px;min-width:18px;height:18px;border-radius:9px;background:#D64545;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

/* Notas de prueba */
.fb-btn{position:fixed;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;border:none;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);z-index:20}
.fb-btn svg{width:24px;height:24px}
.fb{position:fixed;right:18px;bottom:82px;width:340px;max-width:calc(100% - 36px);background:#fff;border-radius:20px;padding:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,.45);z-index:20;display:none;flex-direction:column;gap:10px;font-size:15px}
.fb.open{display:flex}
.fb h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:19px}
.fb textarea{width:100%;min-height:90px;border:1px solid #D9D2C4;border-radius:12px;padding:10px;font:inherit;resize:vertical}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.fb .row button{border:1px solid #D9D2C4;background:#fff;border-radius:10px;padding:8px 12px}
.fb .row button.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.fb .meta{color:var(--ink-soft);font-size:13px}

.start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;flex:1;text-align:center}
.start p{color:var(--ink-soft);max-width:44ch;margin:0}


/* v0.2 */
.choices.col{flex-direction:column;align-items:stretch;width:100%;max-width:560px}
.big.txt{font-size:21px;text-align:left;display:flex;align-items:center;gap:14px;min-height:64px}
.opt-n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--scan-soft);color:var(--scan);font-size:15px;display:grid;place-items:center}
.big:not(.txt) .opt-n{display:none}
.big.right .opt-n{background:rgba(255,255,255,.3);color:#fff}
.story{width:100%;background:#fff;border-radius:24px;padding:20px 26px}
.story h3{margin:0 0 8px;font-family:var(--font-display);font-weight:500;font-size:26px}
.story p{margin:0 0 10px;font-size:21px;line-height:1.55;padding:4px 8px;border-radius:10px;transition:background .3s}
.story p.leyendo{background:var(--scan-soft)}
.note-card.group .faces{display:flex;justify-content:center;gap:8px;margin-top:12px}
.faces span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:600;color:var(--ink)}
.ramas{width:100%;display:flex;flex-direction:column;gap:10px}
.rama{width:100%;display:grid;grid-template-columns:150px 1fr;align-items:center;gap:16px;background:#fff;border:2px solid transparent;border-radius:20px;padding:12px 18px;text-align:left}
.rama:hover{border-color:var(--scan-soft)}
.rama.sel{border-color:var(--scan)}
.rama-name{display:flex;flex-direction:column;gap:4px;font-family:var(--font-display);font-size:21px;font-weight:500}
.state{align-self:flex-start;font-family:var(--font-body);font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:#E3F2EA;color:#1F7550}
.state.off{background:#ECE7DE;color:var(--ink-soft)}
.track{display:flex;align-items:flex-start;min-width:0}
.node{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.node i{width:20px;height:20px;border-radius:50%;border:3px solid #C9D8F6;background:#fff}
.node.hecho i{background:var(--scan);border-color:var(--scan)}
.node.actual i{background:#fff;border-color:var(--scan);box-shadow:0 0 0 5px var(--scan-soft)}
.node em{font-style:normal;font-size:13px;color:var(--ink-soft);line-height:1.2}
.node.actual em{color:var(--ink);font-weight:700}
.link{flex:1;min-width:10px;height:3px;background:#C9D8F6;margin-top:9px}
.rama.pausa{background:#F6F3EE}
.rama.pausa .node i{border-color:#D4CEC3}
.rama.pausa .node.hecho i,.rama.pausa .node.actual i{background:#BEB7AB;border-color:#BEB7AB;box-shadow:none}
.rama.pausa .link{background:repeating-linear-gradient(90deg,#D4CEC3 0 6px,transparent 6px 12px)}
.detail{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-radius:20px;padding:16px 20px}
.detail.muted{color:var(--ink-soft);justify-content:center}
.detail strong{font-family:var(--font-display);font-weight:500;font-size:21px}
.detail p{margin:4px 0 0}
.detail .porque{color:var(--scan);font-style:italic}
.why{flex:none;border:2px solid var(--scan);background:#fff;color:var(--scan);border-radius:16px;padding:10px 18px;font-family:var(--font-display);font-size:20px}
.why:hover{background:var(--scan-soft)}
.perfil{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{background:#fff;border-radius:20px;padding:16px 18px}
.pcard.wide{grid-row:span 2}
.pcard h3{margin:0 0 10px;font-family:var(--font-display);font-weight:500;font-size:19px}
.pcard p{margin:0 0 8px;color:var(--ink-soft);font-size:16px}
.pcard ul{margin:0;padding-left:20px}
.pcard svg{width:100%;height:auto}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:flex;flex-direction:column;background:var(--bg);border-radius:14px;padding:8px 12px;font-weight:700}
.tag small{font-weight:400;font-size:12px;color:var(--ink-soft)}
.tag.strong{background:var(--scan-soft);color:#1D47A3}
.week{display:flex;gap:10px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.day .dots{flex-direction:column-reverse;gap:3px;width:22px}
.day .dots b{height:8px}
.pfoot{grid-column:1/-1;margin:0;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.avisos{width:100%;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.aviso{display:flex;flex-direction:column;gap:6px;background:#fff;border:2px solid transparent;border-radius:18px;padding:14px 18px;text-align:left}
.aviso:hover{border-color:var(--scan-soft)}
.aviso-head{display:flex;align-items:center;gap:12px}
.aviso-head strong{flex:1;font-family:var(--font-display);font-weight:500;font-size:20px}
.aviso .dot{width:10px;height:10px;border-radius:50%;background:transparent}
.aviso.nuevo .dot{background:#D64545}
.aviso .fecha{color:var(--ink-soft);font-size:14px}
.aviso-body{padding-left:22px;font-size:18px}
.big.small{align-self:flex-start;min-height:48px;font-size:18px;padding:8px 18px;margin-left:22px}
.badge[hidden]{display:none}
@media (max-width:900px){
  .rama{grid-template-columns:1fr}
  .track{overflow-x:auto}
  .perfil{grid-template-columns:1fr}
  .pcard.wide{grid-row:auto}
  .detail{flex-direction:column;align-items:flex-start}
}

/* v0.3: recorrido guiado */
.steps{gap:6px;align-items:center}
.steps button{flex-direction:row;gap:8px;min-width:0;padding:10px 16px;font-size:16px;position:relative}
.steps button:not(:last-child)::after{content:"";position:absolute;right:-8px;top:50%;width:10px;height:2px;background:#D9D2C4}
.steps .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--scan-soft);color:var(--scan);font-weight:700;font-size:14px}
.steps .lk{display:none;width:18px;height:18px}
.steps button[aria-current="step"]{background:var(--glass);color:var(--scan);font-weight:700;box-shadow:0 0 0 2px var(--scan)}
.steps button[aria-current="step"] .num{background:var(--scan);color:#fff}
.steps button.seen .num{background:var(--scan);color:#fff}
.steps button.locked{color:#B5AEA2;cursor:not-allowed}
.steps button.locked .num{display:none}
.steps button.locked .lk{display:block}
.actions.sticky{position:sticky;bottom:-20px;width:100%;justify-content:center;background:linear-gradient(180deg,rgba(250,247,241,0),rgba(250,247,241,.95) 40%);padding:18px 0 4px;margin-top:4px}
.updates{width:100%;background:#fff;border-radius:20px;padding:14px 18px;border-left:6px solid var(--scan)}
.updates h3{margin:0 0 6px;font-family:var(--font-display);font-weight:500;font-size:20px;color:var(--scan)}
.updates ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.updates .was{color:var(--ink-soft)}
.perfil .wide2{grid-column:1/-1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.state.new{background:var(--scan);color:#fff}
.state.chg{background:#FFF0DA;color:#8A520F}
.is-new{box-shadow:0 0 0 2px var(--scan)}
li.is-new{box-shadow:none;color:var(--scan);font-weight:700}
.day.today{color:var(--scan);font-weight:700}
.plan-break{align-self:center;font-size:15px;color:var(--ink-soft);background:var(--bg-deep);border-radius:99px;padding:4px 14px}
.agenda{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column}
.agenda li{display:grid;grid-template-columns:60px 24px 1fr auto;align-items:center;gap:12px;padding:10px 14px;border-radius:16px}
.agenda .hora{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:16px}
.agenda .marca{width:14px;height:14px;border-radius:50%;border:3px solid #C9D8F6;background:#fff;justify-self:center}
.agenda .que{display:flex;flex-direction:column}
.agenda .que strong{font-family:var(--font-display);font-weight:500;font-size:20px}
.agenda .que small{color:var(--ink-soft);font-size:15px}
.agenda .que small.was{color:#8A520F}
.agenda li.done{opacity:.55}
.agenda li.done .marca{background:var(--scan);border-color:var(--scan)}
.agenda li.now{background:#fff;box-shadow:0 0 0 2px var(--scan)}
.agenda li.now .marca{border-color:var(--scan);box-shadow:0 0 0 5px var(--scan-soft)}
.agenda li.changed{background:#FFF8EE}
.agenda li.changed .marca{border-color:#E3A33A}
.suggest{width:100%;display:flex;align-items:flex-start;gap:12px;background:var(--scan-soft);border-radius:18px;padding:12px 16px;font-size:16px}
.suggest .pulse{margin-top:7px;flex:none}
.suggest strong{display:block;font-family:var(--font-display);font-weight:500;font-size:18px;color:#1D47A3}
.chat{width:100%;background:#fff;border-radius:20px;padding:12px 16px;display:flex;flex-direction:column;gap:10px;max-height:300px;overflow:auto}
.chat-head{font-size:13px;color:var(--ink-soft);text-align:center}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:80%}
.msg b{display:block;font-size:13px;color:var(--ink-soft)}
.msg p{margin:2px 0 0;background:var(--bg);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:18px}
.msg.me{align-self:flex-end}
.msg.me p{background:var(--scan);color:#fff;border-radius:16px 16px 4px 16px}
.msg.scan{align-self:center;max-width:none;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;background:var(--scan-soft);border-radius:99px;padding:4px 12px}
.who-dot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.qr{border:2px solid var(--scan-soft);background:#fff;border-radius:99px;padding:8px 16px;font-size:17px;color:#1D47A3}
.qr:hover{background:var(--scan-soft)}
.compose{width:100%;display:flex;gap:8px}
.compose input{flex:1;border:1px solid #D9D2C4;border-radius:14px;padding:12px 14px;font:inherit;background:#fff}
.compose input:focus-visible{outline:3px solid var(--scan);outline-offset:2px}
.send{border:none;background:var(--ink);color:#fff;border-radius:14px;padding:0 18px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){
  .steps .lbl{display:none}
  .steps button[aria-current="step"] .lbl{display:inline}
  .agenda li{grid-template-columns:48px 18px 1fr}
  .agenda li .state{display:none}
}

/* v0.4: modo de voz */
.modo-chip{font-size:12px;font-weight:700;letter-spacing:.3px;border-radius:99px;padding:4px 10px;text-transform:uppercase}
.modo-chip.test{background:#ECE7DE;color:var(--ink-soft)}
.modo-chip.real{background:#E3F2EA;color:#1F7550}
.modo-chip.warn{background:#FFF0DA;color:#8A520F}
.mic.live{display:grid;place-items:center;cursor:default;background:var(--good);box-shadow:0 0 0 6px rgba(46,158,107,.18)}
.fb hr{border:none;border-top:1px solid #ECE7DE;margin:4px 0;width:100%}
.fb .modo{flex-direction:column;gap:6px}
.fb .modo label{display:flex;gap:8px;align-items:center}
.fb{max-height:calc(100vh - 110px);overflow:auto}
.diag{max-height:220px;overflow:auto;background:#1F2733;color:#E8EEF8;border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;white-space:pre-wrap;margin:0}
.fb-input{border:1px solid #D9D2C4;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;width:100%}
@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .aside{flex-direction:row;flex-wrap:wrap}
  .aside .panel{flex:1;min-width:240px}
  .mood{grid-template-columns:repeat(2,1fr)}
  .caption{font-size:24px}
}
@media (max-width:480px){
  .top,.main,.nav{padding-left:16px;padding-right:16px}
  .nav button{min-width:0;flex:1}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Scan</div>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>

    <aside class="aside">

          <div class="band-face" id="bandFace">

<script>
/* ===================== PARÁMETROS ===================== */
const PARAMETROS = {
  NOMBRE_ALUMNO: "Joaquín",
  INTERES_PRINCIPAL: "fútbol",
  BLOQUES_DEL_DIA: 3,
  DURACION_BLOQUE_MIN: 25,
  TIEMPO_RESPIRACION_S: 30,
  LECTURA_SCAN_CADA_S: 20,
  FOCO_BAJO_LECTURAS: 2,
  MAX_NO_ENTIENDO: 3,
  VOZ_VELOCIDAD: 0.95,
  VOZ_ACTIVA: true,
  TEXTO_POR_QUE: "Scan eligió el mejor camino para vos según cómo aprendés."
};

/* ===================== DATOS DE EJEMPLO ===================== */
const PLAN = [
  { id:"mate", materia:"Matemática", corto:"Mate", tema:"Fracciones", min:PARAMETROS.DURACION_BLOQUE_MIN, color:"#DCE7FB", ink:"#2F6BE0", letra:"½" },
  { id:"lengua", materia:"Lengua", corto:"Lengua", tema:"Cuento: La arquera", min:20, color:"#E3F2EA", ink:"#2E9E6B", letra:"A" },
  { id:"ciencias", materia:"Ciencias", corto:"Cienc.", tema:"Las plantas", min:30, color:"#FBEBD6", ink:"#B86A1D", letra:"✿", despuesRecreo:true }
].slice(0, PARAMETROS.BLOQUES_DEL_DIA);

// Lecturas simuladas de la pulsera: [foco, ánimo] de 1 a 4. Se recorren en orden, una cada LECTURA_SCAN_CADA_S.
const LECTURAS = [[4,3],[4,3],[3,3],[2,2],[2,2],[3,3],[4,3],[3,4],[4,4],[3,3],[2,3],[3,3]];

// Cada ejercicio: opciones (texto de los botones), correcta (índice), claves (para reconocer la respuesta por voz
// en bloques de texto), pista, dibujo (método 2) y pasos (método 3).
const BLOQUES = {
  mate: {
    tipo: "num",
    intro: {
      titulo: "Fracciones",
      texto: "Una fracción es una parte de algo entero. Si cortás algo en partes iguales y te quedás con algunas, eso es una fracción.",
      dicho: `Hoy vamos con fracciones, y con ${PARAMETROS.INTERES_PRINCIPAL}. Una fracción es una parte de algo entero: si cortás algo en partes iguales y te quedás con algunas, eso es una fracción.`,
      corto: `Hoy: fracciones, con ${PARAMETROS.INTERES_PRINCIPAL}.`
    },
    ejercicios: [
      {
        enunciado: 'Joaquín jugó <span class="frac">1/3</span> (un tercio) de un partido de 90 minutos. ¿Cuántos minutos jugó?',
        dicho: "Joaquín jugó un tercio de un partido de 90 minutos. ¿Cuántos minutos jugó?",
        opciones: ["30", "45", "3"], correcta: 0,
        pista: "Un tercio es cortar en 3 partes iguales. ¿Cuánto es 90 dividido 3?",
        dibujo: { dicho: "Mirá el partido como una barra: 90 minutos cortados en 3 pedazos iguales. Cada pedazo dura 30 minutos. Joaquín jugó un pedazo.", svg: () => barraPartido() },
        pasos: [
          { pregunta: "¿En cuántas partes iguales cortamos el partido?", opciones:["3", "90", "1"], correcta:0 },
          { pregunta: "Si cortamos 90 minutos en 3 partes, ¿cuánto dura cada parte?", opciones:["30", "3", "60"], correcta:0 },
          { pregunta: "Joaquín jugó 1 de esas partes. ¿Cuántos minutos son?", opciones:["30", "90", "1"], correcta:0 }
        ]
      },
      {
        enunciado: 'Tu equipo hizo 12 goles en el torneo. El 9 hizo <span class="frac">3/4</span> (tres cuartos) de los goles. ¿Cuántos goles hizo el 9?',
        dicho: "Tu equipo hizo 12 goles en el torneo. El 9 hizo tres cuartos de los goles. ¿Cuántos goles hizo el 9?",
        opciones: ["9", "3", "4"], correcta: 0,
        pista: "Primero repartí los 12 goles en 4 grupos iguales. Después juntá 3 grupos.",
        dibujo: { dicho: "Mirá los 12 goles repartidos en 4 grupos iguales. Cada grupo tiene 3 goles. El 9 hizo los goles de 3 grupos.", svg: () => pelotas() },
        pasos: [
          { pregunta: "¿En cuántos grupos iguales repartimos los 12 goles?", opciones:["4", "3", "12"], correcta:0 },
          { pregunta: "12 goles en 4 grupos: ¿cuántos goles hay en cada grupo?", opciones:["3", "4", "8"], correcta:0 },
          { pregunta: "El 9 hizo 3 grupos de 3 goles. ¿Cuánto es 3 + 3 + 3?", opciones:["9", "6", "12"], correcta:0 }
        ]
      }
    ]
  },

  lengua: {
    tipo: "texto",
    intro: {
      titulo: "La arquera",
      cuento: [
        "Lucía era la arquera del equipo del barrio. Antes de cada partido se ataba los cordones dos veces, porque una vez se le había salido el botín en un penal.",
        "El sábado jugaban la final. Faltaba un minuto y el árbitro cobró penal para el otro equipo. Todos se quedaron callados.",
        "Lucía miró la pelota, respiró hondo y se tiró a la izquierda. ¡La atajó! Sus compañeros corrieron a abrazarla y la levantaron en andas."
      ],
      dicho: "Te leo un cuento. Se llama La arquera. Escuchá con atención, después te hago unas preguntas.",
      corto: "Escuchá el cuento."
    },
    ejercicios: [
      {
        enunciado: "¿Por qué Lucía se ataba los cordones dos veces?",
        dicho: "¿Por qué Lucía se ataba los cordones dos veces?",
        opciones: ["Porque una vez se le salió el botín en un penal", "Porque estaba lloviendo", "Porque se lo pidió el árbitro"], correcta: 0,
        claves: [/bot[ií]n|sali[oó]|penal|zapat/, /llov|lluvia/, /[aá]rbitro|referi/],
        pista: "Buscá en el cuento la parte de los cordones. ¿Qué le había pasado una vez?",
        dibujo: { dicho: "Mirá el dibujo: una vez, pateando un penal, a Lucía se le salió el botín. Por eso ahora se ata los cordones dos veces.", svg: () => botinVolando() },
        pasos: [
          { pregunta: "Leé esta parte: «se ataba los cordones dos veces, porque una vez se le había salido el botín». ¿Qué palabra nos dice el motivo?", opciones:["porque", "antes", "dos"], correcta:0, claves:[/porque/, /antes/, /dos/] },
          { pregunta: "Después de «porque», ¿qué le había pasado a Lucía?", opciones:["Se le salió el botín", "Perdió la pelota", "Se cayó"], correcta:0, claves:[/bot[ií]n|sali[oó]/, /pelota/, /cay/] }
        ]
      },
      {
        enunciado: "Al final del cuento, ¿cómo se sintieron sus compañeros?",
        dicho: "Al final del cuento, ¿cómo se sintieron sus compañeros?",
        opciones: ["Contentos", "Enojados", "Aburridos"], correcta: 0,
        claves: [/content|feliz|alegr|bien/, /enoj|mal/, /aburr/],
        pista: "Fijate qué hicieron sus compañeros al final: corrieron a abrazarla y la levantaron en andas.",
        dibujo: { dicho: "Mirá: los compañeros levantan a Lucía en andas. Eso se hace cuando alguien ganó algo importante y todos están felices.", svg: () => enAndas() },
        pasos: [
          { pregunta: "¿Qué hizo Lucía en el último penal?", opciones:["Lo atajó", "Lo pateó", "Se fue"], correcta:0, claves:[/ataj/, /pate/, /fue/] },
          { pregunta: "Si tu arquera ataja el penal y ganan la final, el equipo está…", opciones:["Contento", "Enojado", "Aburrido"], correcta:0, claves:[/content|feliz|alegr/, /enoj/, /aburr/] }
        ]
      }
    ]
  },

  ciencias: {
    tipo: "texto",
    intro: {
      titulo: "Las plantas",
      texto: "Las plantas necesitan agua, luz y aire para crecer. Las raíces toman el agua de la tierra y las hojas usan la luz del sol para fabricar su alimento.",
      dicho: "Ahora, ciencias. Las plantas necesitan agua, luz y aire para crecer. Las raíces toman el agua de la tierra, y las hojas usan la luz del sol para fabricar su alimento.",
      corto: "Hoy: qué necesitan las plantas."
    },

let vozES = null;
function elegirVoz(){
  if (!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices();
  vozES = v.find(x => /es[-_]AR/i.test(x.lang)) || v.find(x => /es[-_](419|US|MX)/i.test(x.lang)) || v.find(x => /^es/i.test(x.lang)) || null;
}

let hablaId = 0;
function decir(texto, sub, alTerminar, visible){
  const id = ++hablaId;
  const cb = alTerminar; alTerminar = () => { if (id === hablaId && cb) cb(); };
  S.ultimoDicho = texto;
  caption.innerHTML = esc(visible || texto) + (sub ? "<small>" + esc(sub) + "</small>" : "");
  $("#repeatBtn").hidden = false;
  if (modoReal()){ decirIA(texto, alTerminar); return; }
  const wrap = $("#orbWrap");
  if (!PARAMETROS.VOZ_ACTIVA || !("speechSynthesis" in window)){
    wrap.classList.add("speaking");
    setTimeout(() => { if (id === hablaId) wrap.classList.remove("speaking"); alTerminar(); }, Math.min(4000, 600 + texto.length * 35));
    return;
  }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = vozES ? vozES.lang : "es-AR"; if (vozES) u.voice = vozES;
    u.rate = PARAMETROS.VOZ_VELOCIDAD; u.pitch = 1.05;
    let listo = false;
    const fin = () => { if (listo) return; listo = true; if (id === hablaId) wrap.classList.remove("speaking"); alTerminar(); };
    u.onstart = () => wrap.classList.add("speaking");
    u.onend = fin; u.onerror = fin;
    speechSynthesis.speak(u);
    setTimeout(fin, 1500 + texto.length * 90); // por si el navegador no avisa el final
  } catch(e){ alTerminar(); }
}

// Un intento de conexión: vale si la sesión sigue viva 2,5 s después de abrirse.
function intentarSesion(Conversation, conOverrides, tipo){
  return new Promise(async resuelve => {
    let listo = false, conv = null;
    const fin = ok => { if (listo) return; listo = true; if (!ok && conv){ try { conv.endSession(); } catch(e){} } resuelve(ok ? conv : null); };
    const textoError = x => String((x && (x.message || x.reason || (x.closeReason))) || x || "error desconocido");
    const opciones = Object.assign({ agentId: CFG.agentId, connectionType: tipo || "webrtc" }, opcionesSesion(), {
      onError: (e, ctx) => { IA.error = textoError(e) + (ctx ? " · " + jsonCorto(ctx) : ""); evento("ia_error", { error: IA.error, conOverrides, tipo }); if (!listo) fin(false); else pintarModo(); },
      onDisconnect: d => {
        if (!listo){ if (d) IA.error = IA.error || textoError(d); fin(false); return; }
        const era = IA.estado; IA.estado = "apagado"; IA.conv = null; pintarModo(); if (era === "conectado") evento("ia_desconectada", { detalle: textoError(d) });
      }
    });
    if (conOverrides) opciones.overrides = { agent: { prompt: { prompt: PROMPT_TUTOR() }, firstMessage: "", language: "es" } };
    try { conv = await Conversation.startSession(opciones); }
    catch(e){ IA.error = textoError(e); return fin(false); }
    setTimeout(() => fin(true), 2500);
  });
}
async function conectarIA(){
  if (CFG.modo !== "real") return false;
  if (!CFG.agentId){ IA.error = "falta el Agent ID"; IA.estado = "error"; pintarModo(); return false; }
  IA.estado = "conectando"; IA.error = ""; IA.sinOverrides = false; pintarModo();
  caption.textContent = "Conectando con Miseño…";
  let Conversation;
  try { ({ Conversation } = await cargarSDK()); }
  catch(e){ IA.estado = "error"; IA.error = e.message; evento("ia_fallo_conexion", { error: IA.error }); pintarModo(); return false; }
  // 1) con el guion de la app; 2) si ElevenLabs rechaza los overrides, con el guion cargado en el panel del agente
  // Prueba en orden: WebRTC con guion, WebRTC sin guion, WebSocket con guion, WebSocket sin guion.
  let conv = null, primerError = "";
  for (const [tipo, ov] of [["webrtc", true], ["webrtc", false], ["websocket", true], ["websocket", false]]){
    IA.error = "";
    conv = await intentarSesion(Conversation, ov, tipo);
    if (conv){ IA.sinOverrides = !ov; IA.tipo = tipo; break; }
    primerError = primerError || IA.error;
    evento("ia_reintento", { tipo, conOverrides: ov, error: IA.error });
  }
  if (!conv) IA.error = IA.error || primerError;
  if (!conv){ IA.estado = "error"; IA.conv = null; evento("ia_fallo_conexion", { error: IA.error }); pintarModo(); return false; }
  IA.conv = conv; IA.estado = "conectado"; IA.error = ""; evento("ia_conectada", { sinOverrides: IA.sinOverrides }); pintarModo();
  return true;
}

    if (typeof x !== "object" || x === null) return String(x);
    return JSON.stringify(x, (k, v) => v instanceof Error ? v.name + ": " + v.message : v).slice(0, 600);
  } catch(e){ return String(x); }
}

      onConnect: x => { conectado = true; log(ms() + " conectó " + jsonCorto(x)); },
      onError: (m, ctx) => log(ms() + " ERROR: " + jsonCorto(m) + (ctx ? " · contexto: " + jsonCorto(ctx) : "")),
      onDisconnect: d => { cayo = true; log(ms() + " se desconectó: " + jsonCorto(d)); },
      onMessage: m => log(ms() + " mensaje (" + (m.role || m.source) + "): " + String(m.message).slice(0, 80)),
      onDebug: d => log(ms() + " debug: " + jsonCorto(d).slice(0, 200)),
      onIncomingEvent: ev => { if (ev && /error|interrupt|initiation/i.test(ev.type || "")) log(ms() + " evento: " + jsonCorto(ev).slice(0, 300)); }
    };
    if (ov) op.overrides = { agent: { prompt: { prompt: PROMPT_TUTOR() }, firstMessage: "", language: "es" } };
    try { conv = await Conversation.startSession(op); log(ms() + " startSession terminó"); }
    catch(e){ log(ms() + " startSession FALLÓ: " + jsonCorto(e)); }
    await new Promise(r => setTimeout(r, 4000));
    log(conectado && !cayo ? "RESULTADO: anda ✔" : "RESULTADO: no anda ✘");
    try { conv && conv.endSession(); } catch(e){}
    await new Promise(r => setTimeout(r, 800));
  }
  log(""); log("Listo. Tocá “Copiar diagnóstico” y pegáselo a Claude.");
  LOG.diagnostico = lineas.slice(); guardarLog();
}

const Recon = window.SpeechRecognition || window.webkitSpeechRecognition;
let alEscuchar = null; // función que recibe el texto oído en la pantalla actual

function prepararRecon(){
  if (!Recon) return;
  try {
    const r = new Recon(); r.lang = "es-AR"; r.interimResults = true; r.continuous = false;
    r.onresult = ev => {
      let t = ""; for (const res of ev.results) t += res[0].transcript;
      const h = $("#heard"); if (h) h.textContent = "Te escuché: “" + t + "”";
      if (ev.results[ev.results.length - 1].isFinal){ LOG.usoVoz++; guardarLog(); procesarVoz(t); }
    };
    r.onerror = ev => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed"){ S.micOk = false; render(); }
      pararEscucha();
    };
    r.onend = () => pararEscucha();
    S.recon = r; S.micOk = true;
  } catch(e){ S.micOk = false; }
}
function empezarEscucha(){
  if (modoReal() || !S.recon || S.escuchando) return;
  try { speechSynthesis && speechSynthesis.cancel(); } catch(e){}
  try { S.recon.start(); S.escuchando = true; $("#orbWrap").classList.add("listening"); const m = $("#mic"); if (m) m.classList.add("on"); } catch(e){}
}
function pararEscucha(){
  if (S.recon && S.escuchando){ try { S.recon.stop(); } catch(e){} }
  S.escuchando = false; $("#orbWrap").classList.remove("listening"); const m = $("#mic"); if (m) m.classList.remove("on");
}
const PALABRAS_NUM = { uno:1, una:1, un:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10, doce:12, treinta:30, sesenta:60, noventa:90, "cuarenta y cinco":45 };
function numeroDe(t){
  const d = t.match(/\d+/); if (d) return Number(d[0]);
  const s = t.toLowerCase();
  if (s.includes("cuarenta y cinco")) return 45;
  for (const w of s.split(/\s+/)) if (PALABRAS_NUM[w] !== undefined) return PALABRAS_NUM[w];
  return null;
}
function procesarVoz(t){
  const s = t.toLowerCase();
  if (/no entiendo|no entend|no s[eé]/.test(s)){ noEntiendo("voz"); return; }
  if (/repet/.test(s)){ repetir(); return; }
  if (alEscuchar) alEscuchar(s);
}

  if (!S.micOk) return `<div class="mic-wrap"><button class="mic" id="mic" disabled aria-label="Micrófono bloqueado">${ICON_MIC}</button>Micrófono bloqueado. Usá los botones.</div>`;
  return `<div class="mic-wrap"><button class="mic" id="mic" aria-label="Mantené apretado para hablar">${ICON_MIC}</button>${esc(texto || "Mantené apretado y hablá")}<div class="heard" id="heard"></div></div>`;
}

const ICON_HELP = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>';

const bloqueActual = () => BLOQUES[PLAN[S.bloque].id];

function botonesOpciones(opciones){
  const txt = bloqueActual().tipo === "texto";
  return `<div class="choices${txt ? " col" : ""}">${opciones.map((o, i) => `<button class="big${txt ? " txt" : ""}" data-i="${i}"><span class="opt-n">${i + 1}</span>${esc(o)}</button>`).join("")}</div>`;

function indiceOido(s, item){
  if (bloqueActual().tipo === "num"){ const n = numeroDe(s); return n === null ? -1 : item.opciones.findIndex(o => Number(o) === n); }
  return (item.claves || []).findIndex(r => r.test(s));

function pBloque(){
  const blo = bloqueActual(), b = PLAN[S.bloque];
  const e = blo.ejercicios[S.ej];

  }
  if (S.modo === "dibujo"){
    content.innerHTML = cabeceraBloque() + `<span class="method-tag">Otra forma: con un dibujo</span><div class="visual">${e.dibujo.svg()}</div>

function leerCuento(){

  const leer = i => {
    if (i >= it.cuento.length){ marcar(-1); decir("Fin del cuento. ¿Lo escuchaste bien? Tocá “Ya lo escuché” para las preguntas.", null, null, "Fin del cuento."); return; }
    marcar(i); S.textual = true; decir(it.cuento[i], null, () => leer(i + 1), "Escuchá el cuento."); S.textual = false;
  };
  decir(it.dicho, null, () => leer(0), it.corto);
}
function repetirPregunta(){ if (S.pantalla === "bloque") render(); }
function boton(i){ return content.querySelector(`[data-i="${i}"]`); }
function marcarMal(el){ if (el){ el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong"); } }

function responder(i, el){
  const e = bloqueActual().ejercicios[S.ej]; el = el || boton(i);
  evento("respuesta", { bloque: PLAN[S.bloque].id, ejercicio: S.ej + 1, valor: e.opciones[i], correcta: i === e.correcta });
  if (i === e.correcta){
    if (el) el.classList.add("right");
    pulsera("¡Bien!", "", true);
    decir(`¡Eso! ${e.opciones[e.correcta]}.`, null, () => siguienteEjercicio(), "¡Eso!");
    return;
  }
  marcarMal(el);
  S.errores++;
  if (S.errores === 1) decir("Casi. Te doy una pista: " + e.pista);
  else { S.errores = 0; noEntiendo("dos_errores"); }
}
function responderPaso(i, el){
  const e = bloqueActual().ejercicios[S.ej], p = e.pasos[S.paso]; el = el || boton(i);
  if (i !== p.correcta){ marcarMal(el); decir("Mmm, no. Mirá de nuevo: " + p.pregunta, null, null, "Mmm, no. Mirá de nuevo."); return; }
  if (el) el.classList.add("right");
  if (S.paso < e.pasos.length - 1){ S.paso++; decir("¡Bien!", null, () => render()); }
  else { S.paso = 0; S.modo = "pregunta"; decir("¡Bien! Ahora probá con la pregunta.", null, () => render()); }
}
function noEntiendo(origen){
  if (S.tab !== "hoy" || S.pantalla !== "bloque" || S.modo === "intro") return;
  S.noEntiendo++; LOG.noEntiendo++; evento("no_entiendo", { origen, bloque: PLAN[S.bloque].id, ejercicio: S.ej + 1, vez: S.noEntiendo });
  tarea("t2_no_entiendo", "uso");
  if (S.noEntiendo >= PARAMETROS.MAX_NO_ENTIENDO){
    evento("derivado_a_docente", { bloque: PLAN[S.bloque].id, ejercicio: S.ej + 1 });
    content.innerHTML = cabeceraBloque() + `<div class="note-card"><strong>Le aviso a tu seño</strong>Ella va a venir a ayudarte con este ejercicio. Mientras, seguimos con el próximo.</div><div class="actions"><button class="big primary" id="seguir">Seguir</button></div>`;
    $("#seguir").onclick = () => siguienteEjercicio();
    alEscuchar = s => { if (/segu|dale|listo/.test(s)) siguienteEjercicio(); };
    pulsera("Aviso", "a tu seño", true);
    decir("No pasa nada. Le voy a avisar a tu seño para que venga a ayudarte. Mientras, seguimos con el próximo.", null, null, "Le aviso a tu seño.");
    return;
  }
  // nunca el mismo método dos veces seguidas: 1 = dibujo, 2 = paso a paso
  S.modo = S.noEntiendo === 1 ? "dibujo" : "pasos"; S.paso = 0;
  render();
}
function siguienteEjercicio(){
  S.ej++; S.errores = 0; S.noEntiendo = 0; S.paso = 0; S.modo = "pregunta";
  if (S.ej >= bloqueActual().ejercicios.length){
    if (PLAN[S.bloque].id === "mate") tarea("t2_no_entiendo", "fin");
    evento("bloque_fin", { bloque: PLAN[S.bloque].id });
    S.hechos.push(PLAN[S.bloque].id); ir("finBloque"); return;
  }
  render();
}
function pFinBloque(){
  const b = PLAN[S.bloque], sig = PLAN[S.bloque + 1], cierre = BLOQUES[b.id].cierre;
  const antesDelRecreo = sig && sig.despuesRecreo && !b.despuesRecreo;
  pulsera("¡Bien!", "bloque terminado", true);
  let boton = sig ? "Siguiente: " + esc(sig.materia) : "Terminar el día";
  if (antesDelRecreo) boton = "Ver qué cambió en mi camino";
  content.innerHTML = `<div class="start"><div class="celebrate" aria-hidden="true">✓</div>
    ${cierre ? `<div class="note-card group"><strong>${esc(cierre.titulo)}</strong>${esc(cierre.texto)}<div class="faces"><span style="background:#F3C98B">J</span><span style="background:#C9B6F2">S</span><span style="background:#A9D8C2">B</span></div></div>` : ""}
    ${antesDelRecreo ? `<div class="note-card"><strong>Terminaste tus lecciones de la mañana</strong>Antes del recreo, Scan te muestra qué cambió.</div>` : ""}
    <div class="choices"><button class="big primary" id="sigBloque">${boton}</button></div></div>`;
  const seguir = () => {

  };
  $("#sigBloque").onclick = seguir;

  else dicho += sig ? " Sigue " + sig.materia + "." : " Ese era el último bloque.";

/* ===================== RECORRIDO GUIADO =====================
   Lección → Mi camino → Mi perfil → Agenda → Recreo.
   Cada etapa se desbloquea cuando el sistema termina de mostrar la anterior.
   Las etapas ya vistas se pueden volver a abrir; las que vienen, no. */
const ETAPAS = ["hoy", "camino", "perfil", "agenda", "recreo"];
const NOMBRE_ETAPA = { hoy:"tu lección", camino:"tu camino", perfil:"tu perfil", agenda:"tu agenda", recreo:"el recreo" };
function desbloquear(i){ if (i > S.desbloq){ S.desbloq = i; evento("desbloqueo", { etapa: ETAPAS[i] }); } pintarPasos(); }
function pintarPasos(){
  document.querySelectorAll(".steps [data-tab]").forEach(b => {
    const i = ETAPAS.indexOf(b.dataset.tab), bloq = i > S.desbloq;
    b.classList.toggle("locked", bloq);
    b.classList.toggle("seen", !bloq && b.dataset.tab !== S.tab);
    b.setAttribute("aria-disabled", String(bloq));
    b.setAttribute("aria-current", b.dataset.tab === S.tab ? "step" : "false");
  });
}
function irEtapa(t){
  const i = ETAPAS.indexOf(t);
  if (i > S.desbloq){
    evento("etapa_bloqueada", { etapa: t });
    decir(`Todavía no. Primero terminá ${NOMBRE_ETAPA[ETAPAS[S.desbloq]]}.`);
    return;
  }
  S.tab = t; evento("etapa", { etapa: t }); alEscuchar = null; pararEscucha();
  $("#stage").scrollTop = 0;
  pintarPasos(); render();
}
document.querySelectorAll(".steps [data-tab]").forEach(b => b.onclick = () => irEtapa(b.dataset.tab));
const cambiarTab = irEtapa;
function botonSeguir(id, texto){ return `<div class="actions sticky"><button class="big primary" id="${id}">${texto}</button></div>`; }

/* ---- Lo que cambió hoy (se arma con lo que hizo el alumno) ---- */
function costoMate(){ return LOG.eventos.filter(e => e.tipo === "no_entiendo" && e.bloque === "mate").length; }
function cambiosCamino(){
  const c = costoMate() > 0;
  return [
    { rama:"mate", texto: c ? "Matemática: sumamos 2 bloques de fracciones por semana." : "Matemática: ¡avanzaste! Ya casi pasás a Decimales." },

}
function cambiosPerfil(){

/* ---- Mi camino ---- */
let ramaSel = null;
function pCamino(){
  tarea("t3_camino_por_que", "inicio");
  pulsera("Camino", "3 cambios");
  if (S.hechos.includes("lengua")){ const l = RAMAS.find(r => r.id === "lengua"); l.actual = 1; }
  const musica = RAMAS.find(r => r.id === "musica"); musica.desde = "hoy, 8 de noviembre";
  const cambios = cambiosCamino(), nuevas = cambios.map(c => c.rama);
  const fila = r => {
    const pausa = r.estado === "pausa";
    const nodos = r.tramos.map((t, i) => {
      const cls = i < r.actual ? "hecho" : i === r.actual ? "actual" : "";
      return `<span class="node ${cls}"><i></i><em>${esc(t)}</em></span>`;
    }).join('<span class="link"></span>');
    return `<button class="rama ${pausa ? "pausa" : ""} ${ramaSel === r.id ? "sel" : ""}" data-r="${r.id}">
      <span class="rama-name">${esc(r.nombre)}<span class="chips"><span class="state ${pausa ? "off" : ""}">${pausa ? "En pausa" : "Activa"}</span>${nuevas.includes(r.id) ? '<span class="state new">Nuevo</span>' : ""}</span></span>
      <span class="track">${nodos}</span></button>`;
  };
  const r = RAMAS.find(x => x.id === ramaSel);
  let detalle = "";
  if (r){
    const pausa = r.estado === "pausa";
    const txt = pausa
      ? `${esc(r.nombre)} está en pausa desde ${esc(r.desde)}. Tu último tema fue ${esc(r.tramos[r.actual])}.`
      : `Estás en ${esc(r.tramos[r.actual])}.${r.tramos[r.actual + 1] ? " Después viene " + esc(r.tramos[r.actual + 1]) + "." : ""}`;
    detalle = `<div class="detail"><div><strong>${esc(r.nombre)}</strong><p>${txt}</p><p class="porque" id="porqueTxt" hidden></p></div><button class="why" id="porque">¿Por qué?</button></div>`;
  }
  content.innerHTML = `
    <div class="updates"><h3>Lo nuevo en tu camino</h3><ul>${cambios.map(c => `<li>${esc(c.texto)}</li>`).join("")}</ul></div>
    <div class="ramas">${RAMAS.map(fila).join("")}</div>${detalle}
    ${S.desbloq <= 1 ? botonSeguir("seguirEtapa", "Seguir: mi perfil") : ""}`;
  content.querySelectorAll("[data-r]").forEach(x => x.onclick = () => {
    ramaSel = x.dataset.r; evento("rama", { rama: ramaSel }); pCamino();
    const rr = RAMAS.find(y => y.id === ramaSel);
    decir(rr.estado === "pausa" ? `${rr.nombre} está en pausa.` : `En ${rr.nombre} estás en ${rr.tramos[rr.actual]}.`);
  });
  const pq = $("#porque");
  if (pq) pq.onclick = () => {
    LOG.porQue++; evento("por_que", { rama: ramaSel });
    if (r.estado === "pausa") tarea("t3_camino_por_que", "fin");
    const t = $("#porqueTxt"); t.hidden = false; t.textContent = "Scan: " + PARAMETROS.TEXTO_POR_QUE;
    decir(PARAMETROS.TEXTO_POR_QUE);
  };
  const sg = $("#seguirEtapa"); if (sg) sg.onclick = () => { desbloquear(2); irEtapa("perfil"); };
  alEscuchar = s => { if (/segu|perfil|dale|listo/.test(s) && sg) sg.click(); };
  if (!r) decir(`Mirá lo nuevo en tu camino. ${cambios.map(c => c.texto).join(" ")} Tocá una materia para ver más.`, null, null, "Lo nuevo en tu camino");
}

/* ---- Recreo: chat con amigos ---- */
const CHAT = { mensajes: [
  { de:"Mati", c:"#F2B6A0", t:"¿Quién juega a la pelota en el recreo? ⚽" },
  { de:"Sofía", c:"#C9B6F2", t:"Yo voy a la huerta a ver si salieron los tomates 🌱" }
], scanDijo:false, respondido:{} };
const RESPUESTAS_RAPIDAS = ["¡Yo juego a la pelota!", "Voy a la huerta", "¿Dónde nos vemos?"];
function pRecreo(){
  pulsera("Recreo", "20 min", true);
  const burbuja = m => m.scan

  content.innerHTML = `
    <div class="suggest"><span class="pulse"></span><div><strong>Scan te sugiere</strong>Pasá el recreo con Sofía y Bruno: son tu grupo de la huerta.</div></div>

    <div class="quick">${RESPUESTAS_RAPIDAS.map((q, i) => `<button class="qr" data-q="${i}">${esc(q)}</button>`).join("")}</div>

    <div class="actions">${micHTML("Mantené apretado y dictá")}<button class="big ghost" id="finRecreo">Terminó el recreo</button></div>`;
  const ch = $("#chat"); ch.scrollTop = ch.scrollHeight;
  content.querySelectorAll("[data-q]").forEach(b => b.onclick = () => enviar(RESPUESTAS_RAPIDAS[Number(b.dataset.q)]));

  conectarMic();
  alEscuchar = s => enviar(s);

  else caption.textContent = "¡Recreo! 20 minutos";
}
function enviar(texto){
  evento("chat", { texto });
  CHAT.mensajes.push({ yo:true, t:texto });
  const s = texto.toLowerCase(), r = [];
  if (/pelota|jug|cancha|f[uú]tbol/.test(s)) r.push({ de:"Mati", c:"#F2B6A0", t:"¡Vamos! Cancha 2 😎" });
  else if (/huerta|planta|tomate/.test(s)) r.push({ de:"Sofía", c:"#C9B6F2", t:"¡Sí! Te espero en la huerta 🌱" }, { de:"Bruno", c:"#A9D8C2", t:"Voy también" });
  else if (/d[oó]nde/.test(s)) r.push({ de:"Bruno", c:"#A9D8C2", t:"En el patio de atrás, al lado de la huerta" });
  else r.push({ de:"Sofía", c:"#C9B6F2", t:"😄" });
  pRecreo();
  setTimeout(() => {
    CHAT.mensajes.push(...r);
    if (!CHAT.scanDijo){ CHAT.scanDijo = true; CHAT.mensajes.push({ scan:true, t:"Scan anotó con quién vas a pasar el recreo." }); }
    if (S.tab === "recreo") pRecreo();
  }, 900);
}

function pelotas(){
  let g = "";
  for (let grupo = 0; grupo < 4; grupo++){
    const x0 = 20 + grupo * 155, del9 = grupo < 3;
    g += `<rect x="${x0}" y="40" width="140" height="80" rx="18" fill="${del9 ? "#DCE7FB" : "#F1ECE2"}" stroke="${del9 ? "#2F6BE0" : "#D9D2C4"}" stroke-width="2"/>`;
    for (let i = 0; i < 3; i++){
      const cx = x0 + 32 + i * 38;
      g += `<circle cx="${cx}" cy="80" r="15" fill="#fff" stroke="#1F2733" stroke-width="2"/><path d="M${cx - 6} ${80 - 4} l6 -4 6 4 -2 7 h-8z" fill="#1F2733"/>`;
    }
    g += `<text x="${x0 + 70}" y="146" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="18" fill="${del9 ? "#2F6BE0" : "#5E6878"}">${del9 ? "del 9" : "otros"}</text>`;
  }
  return `<svg viewBox="0 0 640 165" role="img" aria-label="12 goles en 4 grupos de 3; 3 grupos son del 9">
    <text x="320" y="24" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="20" fill="#1F2733">12 goles en 4 grupos iguales</text>${g}</svg>`;
}

    : `<path d="M${x - 14} ${y + 24} l-14 18 M${x + 14} ${y + 24} l14 18" stroke="#1F2733" stroke-width="5" stroke-linecap="round"/>`;

    <path d="M${x - 8} ${y + 56} v24 M${x + 8} ${y + 56} v24" stroke="#1F2733" stroke-width="6" stroke-linecap="round"/>`;

/* ===================== NOTAS DE PRUEBA ===================== */
const fb = $("#fb");
function abrirNotas(){
  fb.classList.add("open");
  $("#fbMeta").textContent = "Pantalla: " + (S.tab === "hoy" ? S.pantalla : S.tab) + " · " + new Date().toLocaleTimeString("es-AR");
  $("#fbCount").textContent = LOG.notas.length + " notas guardadas en este navegador";
  setTimeout(() => $("#fbText").focus(), 30);
}
$("#fbBtn").onclick = () => fb.classList.contains("open") ? fb.classList.remove("open") : abrirNotas();
$("#fbClose").onclick = () => fb.classList.remove("open");
$("#fbSave").onclick = () => {
  const t = $("#fbText").value.trim(); if (!t) return;
  LOG.notas.push({ t: new Date().toISOString(), pantalla: S.tab === "hoy" ? S.pantalla : S.tab, modo: S.modo || null, ejercicio: S.ej + 1, texto: t });
  guardarLog(); $("#fbText").value = "";
  $("#fbCount").textContent = LOG.notas.length + " notas guardadas en este navegador";
};
$("#fbCopy").onclick = async () => {
  const txt = JSON.stringify(LOG, null, 2);
  try { await navigator.clipboard.writeText(txt); $("#fbCount").textContent = "JSON copiado. Pegalo en un archivo de la carpeta feedback/."; }
  catch(e){ $("#fbText").value = txt; $("#fbText").select(); $("#fbCount").textContent = "No se pudo copiar solo: el JSON quedó en el cuadro, copialo a mano."; }
};

/* ===================== TECLADO ===================== */
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "R" && e.shiftKey){ try { localStorage.removeItem(LOG_KEY); } catch(_){}; location.reload(); return; }
  const k = e.key.toLowerCase();
  if (k === "f"){ e.preventDefault(); abrirNotas(); return; }
  if (k === "r"){ repetir(); return; }
  if (k === "n"){ noEntiendo("teclado"); return; }
  if (e.code === "Space" && !e.repeat && !modoReal() && S.micOk && $("#mic") && !$("#mic").disabled){ e.preventDefault(); empezarEscucha(); return; }
  if (S.pantalla === "checkin" && S.tab === "hoy" && /^[1-4]$/.test(k)){ LOG.usoBotones++; elegirAnimo(MOODS[Number(k) - 1].id); return; }
  if (S.pantalla === "bloque" && S.tab === "hoy" && /^[1-3]$/.test(k)){ const b = boton(Number(k) - 1); if (b) b.click(); }
});
document.addEventListener("keyup", e => { if (e.code === "Space" && S.escuchando){ try { S.recon.stop(); } catch(_){} } });
$("#repeatBtn").onclick = repetir;
$("#voiceToggle").onclick = () => {
  PARAMETROS.VOZ_ACTIVA = !PARAMETROS.VOZ_ACTIVA;
  $("#voiceToggle").setAttribute("aria-pressed", String(PARAMETROS.VOZ_ACTIVA));
  if (!PARAMETROS.VOZ_ACTIVA) try { speechSynthesis.cancel(); } catch(_){}
  try { IA.conv && IA.conv.setVolume({ volume: PARAMETROS.VOZ_ACTIVA ? 1 : 0 }); } catch(_){}
};


/* ===================== MODO DE VOZ: PANEL ===================== */
document.querySelectorAll("[name=modo]").forEach(r => r.onchange = async () => {
  CFG.modo = r.value; guardarCfg(); evento("modo", { modo: CFG.modo });
  if (CFG.modo === "testing"){ terminarIA(); IA.estado = "apagado"; IA.error = ""; }
  pintarModo();
  if (CFG.modo === "real" && S.pantalla !== "inicio") { await conectarIA(); render(); }
});
$("#agentId").oninput = e => { CFG.agentId = e.target.value.trim(); guardarCfg(); };
$("#iaDiagBtn").onclick = () => diagnosticoIA();
$("#iaDiagCopy").onclick = async () => { const t = $("#iaDiag").textContent; try { await navigator.clipboard.writeText(t); $("#iaEstado").textContent = "Diagnóstico copiado."; } catch(e){ const r = document.createRange(); r.selectNodeContents($("#iaDiag")); getSelection().removeAllRanges(); getSelection().addRange(r); $("#iaEstado").textContent = "Copialo a mano: ya quedó seleccionado."; } };
$("#iaConectar").onclick = async () => { CFG.modo = "real"; guardarCfg(); pintarModo(); await conectarIA(); if (S.pantalla !== "inicio") render(); };
pintarModo();

/* ===================== ARRANQUE ===================== */
$("#whoName").textContent = PARAMETROS.NOMBRE_ALUMNO;
$("#avatarInitial").textContent = PARAMETROS.NOMBRE_ALUMNO[0];
pintarLectura();
pintarPasos();
render();
</script>
